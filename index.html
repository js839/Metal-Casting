      const rows = active.filter(o => (tab === 'All' || moldingStatus(o) === tab) && `${o.order_id} ${o.model_name} ${o.model_id} ${o.customer_name}`.toLowerCase().includes(q));
      const required = active.reduce((s, o) => s + num(jobFor(o.id)?.molds_required ?? o.quantity), 0);
      const made = active.reduce((s, o) => s + num(jobFor(o.id)?.molds_made), 0);
      const today_ = state.molding_entries.filter(e => e.entry_date === today()).reduce((s, e) => s + num(e.molds_made), 0);
      const tabList = ['All', 'Not Started', 'In Progress', 'Molds Ready', 'Hold'];
      const counts = Object.fromEntries(tabList.map(t => [t, t === 'All' ? active.length : active.filter(o => moldingStatus(o) === t).length]));
      document.getElementById('molding').innerHTML =
        header('Molding', 'All open orders — make molds and record molding consumables') +
        statCards([['Open Orders', active.filter(o => moldingStatus(o) !== 'Molds Ready').length, 'orders', 'orange'], ['Molds Required', required, 'molding', 'blue'], ['Molds Made', made, 'check', 'green'], ['Molds Pending', Math.max(required - made, 0), 'clock', 'amber'], ['Made Today', today_, 'status', 'teal'], ['On Hold', active.filter(o => moldingStatus(o) === 'Hold').length, 'pause', 'red']]) +
        `<div style="margin-bottom:14px">${tabs('molding', tabList, 'renderMolding', counts)}</div>` +
        tablePanel('Molding Queue', rows.length, searchBox('molding', 'Search order, model or customer', 'renderMolding'),
          dataTable(
            [['Order', ''], ['Product / Customer', ''], ['Delivery', ''], ['Required', 'num'], ['Made', 'num'], ['Pending', 'num'], ['Progress', 'wide'], ['Status', ''], ['Actions', 'act']],
            rows.map(moldingRow), 'No orders in this view.'));
    }

    function moldingRow(o) {
      const job = jobFor(o.id);
      const req = num(job?.molds_required ?? o.quantity);
      const made = num(job?.molds_made);
      const st = moldingStatus(o);
      return `<tr class="click" onclick="${job ? `showMoldingHistory('${o.id}')` : `openMoldingEntry('${o.id}')`}">
        ${td('Order', `<span class="mono">${esc(o.order_id)}</span>`, 'lead nowrap')}
        ${td('Product', prodCell(o.product_image_url, o.model_name, `${o.model_id} · ${o.customer_name}`))}
        ${td('Delivery', dueDate(o), 'nowrap')}
        ${td('Required', `<span class="strong">${req}</span>`, 'num')}
        ${td('Made', made, 'num')}
        ${td('Pending', Math.max(req - made, 0), 'num')}
        ${td('Progress', progress(made, req))}
        ${td('Status', pill(st))}
        ${td('Actions', `<div class="actions" onclick="event.stopPropagation()">
          ${st === 'Hold' ? '' : actBtn('primary', 'plus', 'Add Molds', `openMoldingEntry('${o.id}')`)}
          ${job ? actBtn('ghost', 'history', 'History', `showMoldingHistory('${o.id}')`, true) + actBtn(st === 'Hold' ? 'success' : 'danger', st === 'Hold' ? 'play' : 'pause', st === 'Hold' ? 'Resume' : 'Hold', `toggleMoldingHold('${o.id}')`, st !== 'Hold') : ''}
        </div>`, 'act')}
      </tr>`;
    }

    function openMoldingEntry(orderId) {
      const o = orderById(orderId);
      const job = jobFor(orderId);
      const req = job?.molds_required ?? o.quantity;
      const made = num(job?.molds_made);
      modal(`Molding Entry · ${esc(o.order_id)}`, `<form class="form-grid" onsubmit="saveMoldingEntry(event,'${orderId}')">
        ${ctxBox(o, `Molds made so far: <b>${made}</b> of ${esc(req)}`)}
        ${field('molds_required', 'Molds Required (total)', req, 'number', true)}
        ${field('molds_made', 'Molds Made in this Entry', Math.max(num(req) - made, 1), 'number', true)}
        ${field('entry_date', 'Work Date', today(), 'date', true)}
        ${field('operator_name', 'Molding Person', job?.operator_name || '', 'text')}
        ${lineBlock('lines_mold', 'Molding Consumables Used', 'mold', 'Add consumable')}
        ${field('remarks', 'Remarks', '', 'textarea')}
        ${formActions('Save Molding Entry')}</form>`);
      addLine('lines_mold', 'mold');
      if (!lineOptions('mold')) toast('No active Molding consumables in master. Add them in Consumables Master.', true);
    }

    async function saveMoldingEntry(event, orderId) {
      event.preventDefault();
      if (!validate(['molds_required', 'molds_made', 'entry_date'])) return;
      const required = Math.floor(num(val('molds_required')));
      const madeNow = Math.floor(num(val('molds_made')));
      if (required <= 0 || madeNow <= 0) return toast('Molds must be more than 0', true);
      const lines = collectLines('lines_mold');
      if (!lines) return;
      let job = jobFor(orderId);
      if (num(job?.molds_made) + madeNow > required && !confirm(`Total molds (${num(job?.molds_made) + madeNow}) will be more than required (${required}). Save anyway?`)) return;
      const rep = { Prefer: 'return=representation' };
      try {
        if (!job) {
          [job] = await request('molding_jobs', { method: 'POST', headers: rep, body: JSON.stringify({ order_uuid: orderId, molds_required: required, operator_name: val('operator_name') || null }) });
        } else if (num(job.molds_required) !== required || (val('operator_name') && val('operator_name') !== job.operator_name)) {
          await request(`molding_jobs?id=eq.${job.id}`, { method: 'PATCH', body: JSON.stringify({ molds_required: required, operator_name: val('operator_name') || job.operator_name }) });
        }
        const [entry] = await request('molding_entries', { method: 'POST', headers: rep, body: JSON.stringify({ molding_job_id: job.id, order_uuid: orderId, entry_date: val('entry_date'), molds_made: madeNow, operator_name: val('operator_name') || null, remarks: val('remarks') || null }) });
        if (lines.length) {
          await request('molding_consumable_usage', { method: 'POST', body: JSON.stringify(lines.map(l => ({ molding_entry_id: entry.id, molding_job_id: job.id, consumable_id: l.id, consumable_name: l.name, unit_of_measurement: l.unit, qty: l.qty }))) });
        }
        closeModal();
        await refreshAll();
        toast(`${madeNow} molds recorded`);
      } catch (error) { toast(error.message, true); }
    }

    function moldUsage(filterFn) {
      return state.molding_usage.filter(filterFn).map(u => ({ name: u.consumable_name, unit: u.unit_of_measurement, qty: u.qty }));
    }

    function showMoldingHistory(orderId) {
      const o = orderById(orderId);
      const job = jobFor(orderId);
      if (!job) return openMoldingEntry(orderId);
      const entries = state.molding_entries.filter(e => e.molding_job_id === job.id).sort((a, b) => (b.entry_date + b.created_at).localeCompare(a.entry_date + a.created_at));
      const totals = totalsByItem(moldUsage(u => u.molding_job_id === job.id));
      modal(`Molding History · ${esc(o.order_id)}`, `
        ${summary([['Required', job.molds_required], ['Made', job.molds_made], ['Poured', pouredFor(orderId)], ['Status', pill(job.status)]])}
        ${progress(job.molds_made, job.molds_required)}
        <div class="section-label">Total consumables used</div>${usageTable(totals, 'No consumables recorded.')}
        <div class="section-label">Entries (${entries.length})</div>
        ${dataTable([['Date', ''], ['Molds', 'num'], ['Operator', ''], ['Consumables', ''], ['Remarks', ''], ['', 'act']],
          entries.map(e => `<tr>
            ${td('Date', `<span class="strong">${moneyDate(e.entry_date)}</span>`, 'lead nowrap')}
            ${td('Molds', `<span class="strong">${e.molds_made}</span>`, 'num')}
            ${td('Operator', esc(e.operator_name || '—'))}
            ${td('Consumables', usageChips(moldUsage(u => u.molding_entry_id === e.id)))}
            ${td('Remarks', esc(e.remarks || '—'), 'desc')}
            ${td('', `<div class="actions">${actBtn('danger', 'trash', 'Delete entry', `deleteMoldingEntry('${e.id}','${orderId}')`, true)}</div>`, 'act')}
          </tr>`), 'No entries yet.')}
        <div class="form-actions" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">Close</button>${job.status === 'Hold' ? '' : `<button class="btn primary" onclick="openMoldingEntry('${orderId}')">${icon('plus', 'sm')}<span>Add Molds</span></button>`}</div>`);
    }

    async function deleteMoldingEntry(entryId, orderId) {
      const e = state.molding_entries.find(x => x.id === entryId);
      const job = jobFor(orderId);
      if (num(job.molds_made) - num(e.molds_made) < pouredFor(orderId)) return toast('Cannot delete: these molds are already used in melting/pouring', true);
      if (!confirm(`Delete this entry of ${e.molds_made} molds?`)) return;
      try {
        await request(`molding_entries?id=eq.${entryId}`, { method: 'DELETE' });
        await refreshAll();
        toast('Molding entry deleted');
        showMoldingHistory(orderId);
      } catch (error) { toast(error.message, true); }
    }

    async function toggleMoldingHold(orderId) {
      const job = jobFor(orderId);
      if (!job) return;
      try {
        await request(`molding_jobs?id=eq.${job.id}`, { method: 'PATCH', body: JSON.stringify({ status: job.status === 'Hold' ? 'In Progress' : 'Hold' }) });
        await refreshAll();
        toast(job.status === 'Hold' ? 'Molding resumed' : 'Molding put on hold');
      } catch (error) { toast(error.message, true); }
    }

    /* ======================== MELTING & POURING ======================== */
    function meltingView(o) {
      const avail = availableMolds(o.id);
      return avail > 0 ? 'Ready to Pour' : 'Fully Poured';
    }

    function renderMelting() {
      if (!state.productionReady) return productionMissing('melting');
      const q = (state.search.melting || '').toLowerCase();
      const tab = state.filter.melting;
      const withMolds = state.orders.filter(o => ACTIVE_ORDER(o) && num(jobFor(o.id)?.molds_made) > 0);
      const rows = withMolds.filter(o => (tab === 'All' || meltingView(o) === tab) && `${o.order_id} ${o.model_name} ${o.model_id} ${o.customer_name}`.toLowerCase().includes(q));
      const avail = withMolds.reduce((s, o) => s + availableMolds(o.id), 0);
      const pouredKg = state.melting_batches.reduce((s, b) => s + num(b.pour_qty_kg), 0);
      const meltKg = state.melting_batches.reduce((s, b) => s + num(b.melt_qty_kg), 0);
      const running = state.melting_batches.filter(b => !['Poured', 'Hold'].includes(b.status)).length;
      const tabList = ['Ready to Pour', 'Fully Poured', 'All'];
      const counts = Object.fromEntries(tabList.map(t => [t, t === 'All' ? withMolds.length : withMolds.filter(o => meltingView(o) === t).length]));
      const recent = [...state.melting_batches].sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 10);
      document.getElementById('melting').innerHTML =
        header('Melting & Pouring', 'Orders with ready molds — melt raw material and pour') +
        statCards([['Orders with Molds', withMolds.length, 'orders', 'orange'], ['Molds to Pour', avail, 'molding', 'amber'], ['Active Heats', running, 'melting', 'red'], ['Total Heats', state.melting_batches.length, 'history', 'blue'], ['Melted (kg)', fmt(meltKg), 'weight', 'teal'], ['Poured (kg)', fmt(pouredKg), 'check', 'green']]) +
        `<div style="margin-bottom:14px">${tabs('melting', tabList, 'renderMelting', counts)}</div>` +
        tablePanel('Pouring Queue', rows.length, searchBox('melting', 'Search order, model or customer', 'renderMelting'),
          dataTable(
            [['Order', ''], ['Product / Customer', ''], ['Delivery', ''], ['Made', 'num'], ['Poured', 'num'], ['Available', 'num'], ['Progress', 'wide'], ['Status', ''], ['Actions', 'act']],
            rows.map(meltingRow), withMolds.length ? 'No orders in this view.' : 'No molds made yet. Orders appear here once the Molding person records molds.')) +
        tablePanel('Recent Heats', recent.length, '', heatsTable(recent, 'No heats yet.'));
    }

    function meltingRow(o) {
      const job = jobFor(o.id);
      const made = num(job.molds_made);
      const poured = pouredFor(o.id);
      const avail = availableMolds(o.id);
      const heats = batchesFor(o.id);
      return `<tr class="click" onclick="showHeats('${o.id}')">
        ${td('Order', `<span class="mono">${esc(o.order_id)}</span>`, 'lead nowrap')}
        ${td('Product', prodCell(o.product_image_url, o.model_name, `${o.model_id} · ${o.customer_name}`))}
        ${td('Delivery', dueDate(o), 'nowrap')}
        ${td('Made', made, 'num')}
        ${td('Poured', poured, 'num')}
        ${td('Available', `<span class="strong">${avail}</span>`, 'num')}
        ${td('Progress', progress(poured, num(job.molds_required)))}
        ${td('Status', `${avail ? pill('Ready to Pour', 'ReadyforPouring') : pill('All Poured', 'Poured')}<span class="sub">Molding: ${esc(job.status)}</span>`)}
        ${td('Actions', `<div class="actions" onclick="event.stopPropagation()">
          ${avail ? actBtn('primary', 'melting', 'New Heat', `openMeltingForm('${o.id}')`) : ''}
          ${actBtn('ghost', 'history', `Heats (${heats.length})`, `showHeats('${o.id}')`, true)}
          ${state.flowReady && htWaiting(o.id) > 0 ? actBtn('success', 'heat', 'Send to HT', `navigate('heat'); openHTBatchForm('${o.id}')`) : ''}
        </div>`, 'act')}
      </tr>`;
    }

    function meltUsage(batchId) {
      return state.melting_usage.filter(u => u.melting_batch_id === batchId).map(u => ({ id: u.item_id, type: u.item_type, name: u.item_name, unit: u.unit_of_measurement, qty: u.qty }));
    }

    function heatActions(b) {
      const next = HEAT_FLOW[HEAT_FLOW.indexOf(b.status) + 1];
      return `<div class="actions" onclick="event.stopPropagation()">${b.status === 'Hold' ? actBtn('success', 'play', 'Resume', `setHeatStatus('${b.id}','Melting')`) : next ? actBtn('secondary', 'chevron', `Mark ${next}`, `setHeatStatus('${b.id}','${next}')`) : ''}${actBtn('ghost', 'edit', 'Edit heat', `openMeltingForm('${b.order_uuid}','${b.id}')`, true)}</div>`;
    }
    function yieldOf(b) { return num(b.melt_qty_kg) > 0 ? `${Math.round(num(b.pour_qty_kg) / num(b.melt_qty_kg) * 100)}%` : '—'; }

    function heatsTable(list, emptyMsg, withOrder = true) {
      return dataTable(
        [['Heat No', ''], ...(withOrder ? [['Order', '']] : []), ['Date', ''], ['Furnace', ''], ['Operator', ''], ['Molds', 'num'], ['Melt kg', 'num'], ['Pour kg', 'num'], ['Yield', 'num'], ['Status', ''], ['Actions', 'act']],
        list.map(b => {
          const o = orderById(b.order_uuid) || {};
          return `<tr class="click" onclick="showHeats('${b.order_uuid}')">
            ${td('Heat No', `<span class="mono">${esc(b.heat_no)}</span>`, 'lead nowrap')}
            ${withOrder ? td('Order', `<span class="mono">${esc(o.order_id || '—')}</span>`) : ''}
            ${td('Date', moneyDate(b.melting_date), 'nowrap')}
            ${td('Furnace', esc(b.furnace_no || '—'))}
            ${td('Operator', esc(b.operator_name || '—'))}
            ${td('Molds', `<span class="strong">${num(b.molds_poured)}</span>`, 'num')}
            ${td('Melt kg', fmt(b.melt_qty_kg), 'num')}
            ${td('Pour kg', fmt(b.pour_qty_kg), 'num')}
            ${td('Yield', yieldOf(b), 'num')}
            ${td('Status', pill(b.status))}
            ${td('Actions', heatActions(b), 'act')}
          </tr>`;
        }), emptyMsg);
    }

    function heatCard(b) {
      const usage = meltUsage(b.id);
      return `<div class="hist"><div class="hist-top"><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mono">${esc(b.heat_no)}</span>${pill(b.status)}</span>${heatActions(b)}</div>
        <div class="row-meta">${moneyDate(b.melting_date)} · Furnace ${esc(b.furnace_no || '—')} · ${esc(b.operator_name || 'Operator not set')}<br>Molds poured <b>${num(b.molds_poured)}</b> · Melt <b>${fmt(b.melt_qty_kg)} kg</b> · Pour <b>${fmt(b.pour_qty_kg)} kg</b> · Yield <b>${yieldOf(b)}</b></div>
        <div class="row-meta"><b>Raw material</b></div>${usageChips(usage.filter(u => u.type === 'Raw Material'))}
        <div class="row-meta"><b>Melting &amp; pouring consumables</b></div>${usageChips(usage.filter(u => u.type === 'Consumable'))}</div>`;
    }

    function showHeats(orderId) {
      const o = orderById(orderId);
      const job = jobFor(orderId);
      const heats = batchesFor(orderId).sort((a, b) => b.created_at.localeCompare(a.created_at));
      const all = heats.flatMap(b => meltUsage(b.id));
      modal(`Heats · ${esc(o.order_id)}`, `
        ${summary([['Molds made', num(job?.molds_made)], ['Poured', pouredFor(orderId)], ['Available', availableMolds(orderId)], ['Heats', heats.length]])}
        <div class="section-label">Total raw material</div>${usageTable(totalsByItem(all.filter(u => u.type === 'Raw Material')), 'No raw material recorded.')}
        <div class="section-label">Total melting &amp; pouring consumables</div>${usageTable(totalsByItem(all.filter(u => u.type === 'Consumable')), 'No consumables recorded.')}
        <div class="section-label">Heats (${heats.length})</div>
        <div class="list">${heats.map(heatCard).join('') || emptyState('No heats yet.')}</div>
        <div class="form-actions" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">Close</button>${availableMolds(orderId) ? `<button class="btn primary" onclick="openMeltingForm('${orderId}')">${icon('melting', 'sm')}<span>New Heat</span></button>` : ''}</div>`);
    }

    function openMeltingForm(orderId, batchId) {
      const o = orderById(orderId);
      const b = state.melting_batches.find(x => x.id === batchId) || { melting_date: today(), status: 'Melting' };
      const maxMolds = availableMolds(orderId) + num(b.molds_poured);
      modal(`${batchId ? 'Edit Heat ' + esc(b.heat_no) : 'New Heat'} · ${esc(o.order_id)}`, `<form class="form-grid" onsubmit="saveMelting(event,'${orderId}','${batchId || ''}')">
        ${ctxBox(o, `Molds available to pour: <b>${maxMolds}</b>`)}
        <div class="field"><label>Heat No</label><input value="${esc(b.heat_no || 'Auto: HT-000001')}" disabled></div>
        ${field('furnace_no', 'Furnace No', b.furnace_no, 'text')}
        ${field('melting_date', 'Melting Date', b.melting_date, 'date', true)}
        ${field('operator_name', 'Melting Person', b.operator_name, 'text')}
        ${lineBlock('lines_raw', 'Raw Material Charged <span class="req">*</span>', 'raw', 'Add raw material')}
        ${lineBlock('lines_meltcon', 'Melting & Pouring Consumables', 'meltcon', 'Add consumable')}
        <div class="field" data-field="melt_qty_kg"><label for="melt_qty_kg">Melt Qty (kg)</label><input id="melt_qty_kg" type="number" step="0.001" min="0" value="${esc(b.melt_qty_kg ?? '')}"><div class="hint"><a href="#" onclick="event.preventDefault(); fillMeltFromRaw()">Use total of KG raw material lines</a></div></div>
        ${field('pour_qty_kg', 'Pour Qty (kg)', b.pour_qty_kg ?? '', 'number')}
        <div class="field" data-field="molds_poured"><label for="molds_poured">Molds Poured in this Heat <span class="req">*</span></label><input id="molds_poured" type="number" min="0" max="${maxMolds}" value="${esc(batchId ? b.molds_poured : maxMolds)}"><div class="hint">Max ${maxMolds}</div><div class="error">Molds Poured is required</div></div>
        ${selectField('status', 'Heat Status', b.status, ['Pending', 'Melting', 'Ready for Pouring', 'Poured', 'Hold'])}
        ${field('remarks', 'Remarks', b.remarks, 'textarea')}
        ${formActions(batchId ? 'Update Heat' : 'Save Heat', batchId ? `<button class="btn danger" type="button" onclick="deleteHeat('${batchId}','${orderId}')">${icon('trash', 'sm')}<span>Delete Heat</span></button>` : '')}</form>`);
      const usage = batchId ? meltUsage(batchId) : [];
      const raw = usage.filter(u => u.type === 'Raw Material');
      const con = usage.filter(u => u.type === 'Consumable');
      (raw.length ? raw : [{}]).forEach(u => addLine('lines_raw', 'raw', u));
      (con.length ? con : [{}]).forEach(u => addLine('lines_meltcon', 'meltcon', u));
      const meltInput = document.getElementById('melt_qty_kg');
      if (batchId) meltInput.dataset.touched = '1';
      meltInput.addEventListener('input', () => { meltInput.dataset.touched = '1'; });
      const rawBox = document.getElementById('lines_raw');
      rawBox.addEventListener('input', autoMelt);
      rawBox.addEventListener('change', autoMelt);
    }

    function rawKgTotal() {
      let total = 0;
      document.querySelectorAll('#lines_raw .line').forEach(row => {
        const opt = row.querySelector('select').selectedOptions[0];
        const unit = (opt?.dataset.unit || '').toUpperCase();
        const q = num(row.querySelector('input').value);
        if (unit === 'KG') total += q; else if (unit === 'TON') total += q * 1000; else if (unit === 'GRAM') total += q / 1000;
      });
      return total;
    }
    function fillMeltFromRaw() { document.getElementById('melt_qty_kg').value = fmt(rawKgTotal()); }
    function autoMelt() { const m = document.getElementById('melt_qty_kg'); if (m && !m.dataset.touched) m.value = rawKgTotal() ? fmt(rawKgTotal()) : ''; }

    async function saveMelting(event, orderId, batchId) {
      event.preventDefault();
      if (!validate(['melting_date', 'molds_poured'])) return;
      const b = state.melting_batches.find(x => x.id === batchId);
      const maxMolds = availableMolds(orderId) + num(b?.molds_poured);
      const molds = Math.floor(num(val('molds_poured')));
      const melt = num(val('melt_qty_kg'));
      const pour = num(val('pour_qty_kg'));
      if (molds > maxMolds) return toast(`Only ${maxMolds} molds are available`, true);
      if (melt && pour > melt) return toast('Pour qty cannot be more than melt qty', true);
      if (val('status') === 'Poured' && molds <= 0) return toast('Enter molds poured before marking Poured', true);
      const raw = collectLines('lines_raw');
      if (!raw) return;
      const con = collectLines('lines_meltcon');
      if (!con) return;
      if (!raw.length) return toast('Add at least one raw material', true);
      const payload = {
        order_uuid: orderId, furnace_no: val('furnace_no') || null, melting_date: val('melting_date'), operator_name: val('operator_name') || null,
        molds_poured: molds, melt_qty_kg: melt, pour_qty_kg: pour, status: val('status'), remarks: val('remarks') || null,
        raw_material_id: raw[0].id, raw_material_name: raw.map(r => r.name).join(', '), raw_material_qty: raw.reduce((s, r) => s + r.qty, 0),
        consumable_id: con[0]?.id || null, consumable_name: con.map(c => c.name).join(', ') || null, consumable_qty: con.reduce((s, c) => s + c.qty, 0)
      };
      try {
        let id = batchId;
        if (batchId) {
          await request(`melting_batches?id=eq.${batchId}`, { method: 'PATCH', body: JSON.stringify(payload) });
          await request(`melting_material_usage?melting_batch_id=eq.${batchId}`, { method: 'DELETE' });
        } else {
          const [created] = await request('melting_batches', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(payload) });
          id = created.id;
        }
        const lines = [...raw, ...con].map(l => ({ melting_batch_id: id, item_type: l.type, item_id: l.id, item_name: l.name, item_category: l.cat, unit_of_measurement: l.unit, qty: l.qty }));
        if (lines.length) await request('melting_material_usage', { method: 'POST', body: JSON.stringify(lines) });
        closeModal();
        await refreshAll();
        toast(batchId ? 'Heat updated' : 'Heat saved');
      } catch (error) { toast(error.message, true); }
    }

    async function setHeatStatus(id, status) {
      const b = state.melting_batches.find(x => x.id === id);
      if (status === 'Poured' && num(b.molds_poured) <= 0) return openMeltingForm(b.order_uuid, id);
      try {
        await request(`melting_batches?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
        await refreshAll();
        toast(`Heat ${b.heat_no}: ${status}`);
        if (document.getElementById('modal').classList.contains('open')) showHeats(b.order_uuid);
      } catch (error) { toast(error.message, true); }
    }

    async function deleteHeat(id, orderId) {
      const hb = state.melting_batches.find(x => x.id === id);
      if (state.flowReady && hb?.status === 'Poured' && pouredDone(orderId) - num(hb.molds_poured) < htLoaded(orderId)) return toast('Cannot delete: castings from this heat are already in Heat Treatment', true);
      if (!confirm('Delete this heat? Its molds will become available again.')) return;
      try {
        await request(`melting_batches?id=eq.${id}`, { method: 'DELETE' });
        await refreshAll();
        toast('Heat deleted');
        showHeats(orderId);
      } catch (error) { toast(error.message, true); }
    }

    /* ========== PRODUCTION: HEAT TREATMENT → FETTLING → STOCK → DISPATCH ========== */
    const FLOW_ORDER = o => o.status !== 'Cancelled';
    const HT_PROCESSES = ['Water Toughening', 'Hardening', 'Tempering', 'Hardening + Tempering', 'Annealing', 'Normalizing', 'Stress Relieving', 'Solution Annealing'];
    const REP = { Prefer: 'return=representation' };
    const sum = (list, fn) => list.reduce((s, x) => s + num(fn(x)), 0);
    const orderMatch = (o, q) => `${o.order_id} ${o.model_name} ${o.model_id} ${o.customer_name}`.toLowerCase().includes(q);

    /* ---- quantities per order (1 mold = 1 casting) ---- */
    function pouredDone(oid) { return sum(batchesFor(oid).filter(b => b.status === 'Poured'), b => b.molds_poured); }
    function htItemsFor(oid) { return state.ht_items.filter(i => i.order_uuid === oid); }
    function htLoaded(oid) { return sum(htItemsFor(oid), i => i.qty); }
    function htDone(oid) { return sum(htItemsFor(oid).filter(i => i.time_out), i => i.qty); }
    function htInFurnace(oid) { return htLoaded(oid) - htDone(oid); }
    function htWaiting(oid) { return Math.max(pouredDone(oid) - htLoaded(oid), 0); }
    function fettleFor(oid) { return state.fettling_entries.filter(e => e.order_uuid === oid); }
    function fettledOk(oid) { return sum(fettleFor(oid), e => e.qty_ok); }
    function fettledRej(oid) { return sum(fettleFor(oid), e => e.qty_rejected); }
    function fettleWaiting(oid) { return Math.max(htDone(oid) - fettledOk(oid) - fettledRej(oid), 0); }
    function dispatchesFor(oid) { return state.dispatches.filter(d => d.order_uuid === oid); }
    function dispatchedQty(oid) { return sum(dispatchesFor(oid), d => d.qty); }
    function stockQty(oid) { return Math.max(fettledOk(oid) - dispatchedQty(oid), 0); }
    function htBatch(id) { return state.ht_batches.find(b => b.id === id); }
    function htItemsOfBatch(bid) { return state.ht_items.filter(i => i.ht_batch_id === bid); }

    /* ---- time helpers ---- */
    function toLocalInput(v) { const d = v ? new Date(v) : new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
    function fromLocalInput(v) { return v ? new Date(v).toISOString() : null; }
    function localToday() { return toLocalInput().slice(0, 10); }
    function localDay(v) { return v ? toLocalInput(v).slice(0, 10) : ''; }
    function dateTime(v) { return v ? new Date(v).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true }) : '—'; }
    function durText(ms) { const m = Math.max(Math.round(ms / 60000), 0); const h = Math.floor(m / 60); return h ? `${h}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`; }
    function itemDur(i) { return (i.time_out ? new Date(i.time_out) : new Date()) - new Date(i.time_in); }
    function targetMs(i) { const h = num(htBatch(i.ht_batch_id)?.soak_hours); return h > 0 ? h * 3600000 : 0; }
    function durCell(i) {
      if (i.time_out) return `<span class="dur">${durText(itemDur(i))}</span>`;
      const t = targetMs(i);
      return `<span class="live ${t && itemDur(i) > t ? 'over' : ''}" data-since="${esc(i.time_in)}" data-target="${t}" title="${t ? `Target ${durText(t)}` : 'Running'}">${durText(itemDur(i))}</span>`;
    }
    setInterval(() => document.querySelectorAll('.live[data-since]').forEach(el => {
      const ms = Date.now() - new Date(el.dataset.since);
      el.textContent = durText(ms);
      el.classList.toggle('over', num(el.dataset.target) > 0 && ms > num(el.dataset.target));
    }), 30000);

    function flowGuard(target, title) {
      if (!state.productionReady) { productionMissing(target); return false; }
      if (!state.flowReady) {
        document.getElementById(target).innerHTML = header(title, 'New production tables not found') +
          `<div class="notice">Run <b>supabase_ht_fettling_dispatch_v3.sql</b> in the Supabase SQL Editor, then press Refresh.<br><small>${esc(state.flowError || '')}</small></div>`;
        return false;
      }
      return true;
    }
    function orderCell(o) { return prodCell(o.product_image_url, o.model_name, `${o.model_id} · ${o.customer_name}`); }
    function sendBtnOrders() { return state.orders.filter(o => FLOW_ORDER(o) && htWaiting(o.id) > 0); }

    /* ============================ HEAT TREATMENT ============================ */
    function renderHeat() {
      if (!flowGuard('heat', 'Heat Treatment')) return;
      const q = (state.search.heat || '').toLowerCase();
      const tab = state.filter.heat;
      const orders = state.orders.filter(FLOW_ORDER);
      const waitingOrders = orders.filter(o => htWaiting(o.id) > 0);
      const open = state.ht_items.filter(i => !i.time_out);
      const done = state.ht_items.filter(i => i.time_out);
      const doneToday = done.filter(i => localDay(i.time_out) === localToday());
      const avg = done.length ? sum(done, itemDur) / done.length : 0;
      const itemMatch = i => { const o = orderById(i.order_uuid); return o && orderMatch(o, q); };
      const tabList = ['In Furnace', 'Waiting', 'Completed', 'Cycle Time'];
      const counts = { 'In Furnace': open.length, 'Waiting': waitingOrders.length, 'Completed': done.length };
      let body;
      if (tab === 'Waiting') {
        const rows = waitingOrders.filter(o => orderMatch(o, q));
        body = tablePanel('Poured castings waiting for Heat Treatment', rows.length, searchBox('heat', 'Search order, model or customer', 'renderHeat'),
          dataTable([['Order', ''], ['Product / Customer', ''], ['Delivery', ''], ['Poured', 'num'], ['In Furnace', 'num'], ['HT Done', 'num'], ['Waiting', 'num'], ['Actions', 'act']],
            rows.map(o => `<tr>
              ${td('Order', `<span class="mono">${esc(o.order_id)}</span>`, 'lead nowrap')}
              ${td('Product', orderCell(o))}
              ${td('Delivery', dueDate(o), 'nowrap')}
              ${td('Poured', pouredDone(o.id), 'num')}
              ${td('In Furnace', htInFurnace(o.id), 'num')}
              ${td('HT Done', htDone(o.id), 'num')}
              ${td('Waiting', `<span class="strong">${htWaiting(o.id)}</span>`, 'num')}
              ${td('Actions', `<div class="actions">${actBtn('primary', 'heat', 'Load in Furnace', `openHTBatchForm('${o.id}')`)}</div>`, 'act')}
            </tr>`), 'No poured castings are waiting. Heats marked "Poured" in Melting appear here.'));
      } else if (tab === 'Cycle Time') {
        body = tablePanel('Heat Treatment time by product', null, '', cycleTable(done));
      } else {
        const list = (tab === 'In Furnace' ? open.sort((a, b) => a.time_in.localeCompare(b.time_in)) : done.sort((a, b) => b.time_out.localeCompare(a.time_out))).filter(itemMatch);
        body = tablePanel(tab === 'In Furnace' ? 'Products in furnace now' : 'Completed heat treatment', list.length, searchBox('heat', 'Search order, model or customer', 'renderHeat'),
          htItemsTable(list, tab === 'In Furnace' ? 'Furnace is empty. Load castings with "New Furnace Batch".' : 'No heat treatment completed yet.'));
      }
      const batches = [...state.ht_batches].sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 15);
      document.getElementById('heat').innerHTML =
        header('Heat Treatment', 'Load poured castings in the furnace and record In / Out time of every product',
          `<button class="btn primary" onclick="openHTBatchForm()">${icon('plus', 'sm')}<span>New Furnace Batch</span></button>`) +
        statCards([['Waiting for HT (pcs)', sum(orders, o => htWaiting(o.id)), 'clock', 'amber'], ['In Furnace (pcs)', sum(open, i => i.qty), 'heat', 'red'],
          ['Running Batches', state.ht_batches.filter(b => b.status === 'In Furnace').length, 'history', 'blue'], ['Out Today (pcs)', sum(doneToday, i => i.qty), 'unload', 'green'],
          ['Total HT Done (pcs)', sum(done, i => i.qty), 'check', 'teal'], ['Avg Time / Load', done.length ? durText(avg) : '—', 'clock', 'orange']]) +
        `<div style="margin-bottom:14px">${tabs('heat', tabList, 'renderHeat', counts)}</div>` + body +
        tablePanel('Furnace Batches', batches.length, '', htBatchesTable(batches));
    }

    function htItemsTable(list, emptyMsg, inBatch = false) {
      return dataTable(
        [...(inBatch ? [] : [['Batch', '']]), ['Order / Product', ''], ['Pcs', 'num'], ...(inBatch ? [] : [['Furnace / Process', '']]), ['Time In', ''], ['Time Out', ''], ['HT Time', ''], ['Actions', 'act']],
        list.map(i => {
          const o = orderById(i.order_uuid) || {};
          const b = htBatch(i.ht_batch_id) || {};
          return `<tr class="${inBatch ? '' : 'click'}" ${inBatch ? '' : `onclick="showHTBatch('${i.ht_batch_id}')"`}>
            ${inBatch ? '' : td('Batch', `<span class="mono">${esc(b.batch_no || '—')}</span>`, 'lead nowrap')}
            ${td('Product', `<div class="cell-prod">${thumb(o.product_image_url, o.model_name)}<div><b>${esc(o.model_name || '—')}</b><small>${esc(o.order_id || '')}${inBatch ? '' : ` · ${esc(o.customer_name || '')}`}</small></div></div>`, inBatch ? 'lead' : '')}
            ${td('Pcs', `<span class="strong">${num(i.qty)}</span>`, 'num')}
            ${inBatch ? '' : td('Furnace', `${esc(b.furnace_no || '—')}<span class="sub">${esc(b.process_type || '')}${b.temperature_c ? ` · ${fmt(b.temperature_c)}°C` : ''}</span>`)}
            ${td('Time In', dateTime(i.time_in), 'nowrap')}
            ${td('Time Out', i.time_out ? dateTime(i.time_out) : pill('In Furnace'), 'nowrap')}
            ${td('HT Time', durCell(i))}
            ${td('Actions', `<div class="actions" onclick="event.stopPropagation()">
              ${i.time_out ? '' : actBtn('success', 'unload', 'Unload', `unloadHTItem('${i.id}', ${inBatch})`)}
              ${actBtn('ghost', 'edit', 'Edit times', `openHTItemForm('${i.ht_batch_id}','${i.id}')`, true)}
              ${inBatch ? actBtn('danger', 'trash', 'Remove', `deleteHTItem('${i.id}')`, true) : ''}
            </div>`, 'act')}
          </tr>`;
        }), emptyMsg);
    }

    function cycleTable(done) {
      const map = {};
      done.forEach(i => {
        const o = orderById(i.order_uuid) || {};
        const b = htBatch(i.ht_batch_id) || {};
        const k = `${o.model_id}|${b.process_type || ''}`;
        const ms = itemDur(i);
        const r = map[k] = map[k] || { o, process: b.process_type || '—', loads: 0, pcs: 0, total: 0, min: Infinity, max: 0 };
        r.loads++; r.pcs += num(i.qty); r.total += ms; r.min = Math.min(r.min, ms); r.max = Math.max(r.max, ms);
      });
      const rows = Object.values(map).sort((a, b) => b.total / b.loads - a.total / a.loads);
      return dataTable([['Product', ''], ['Process', ''], ['Loads', 'num'], ['Pcs', 'num'], ['Avg Time', 'num'], ['Fastest', 'num'], ['Slowest', 'num']],
        rows.map(r => `<tr>
          ${td('Product', prodCell(r.o.product_image_url, r.o.model_name, r.o.model_id), 'lead')}
          ${td('Process', esc(r.process))}
          ${td('Loads', r.loads, 'num')}
          ${td('Pcs', r.pcs, 'num')}
          ${td('Avg Time', `<span class="dur">${durText(r.total / r.loads)}</span>`, 'num')}
          ${td('Fastest', durText(r.min), 'num')}
          ${td('Slowest', durText(r.max), 'num')}
        </tr>`), 'Cycle time appears after the first product is unloaded from the furnace.');
    }

    function batchSpan(bid) {
      const items = htItemsOfBatch(bid);
      if (!items.length) return null;
      const start = Math.min(...items.map(i => new Date(i.time_in)));
      const open = items.some(i => !i.time_out);
      const end = open ? Date.now() : Math.max(...items.map(i => new Date(i.time_out)));
      return { start, open, ms: end - start };
    }

    function htBatchesTable(list) {
      return dataTable([['Batch No', ''], ['Date', ''], ['Furnace', ''], ['Process', ''], ['Orders', 'num'], ['Out / Pcs', 'num'], ['Batch Time', ''], ['Status', ''], ['Actions', 'act']],
        list.map(b => {
          const items = htItemsOfBatch(b.id);
          const sp = batchSpan(b.id);
          return `<tr class="click" onclick="showHTBatch('${b.id}')">
            ${td('Batch No', `<span class="mono">${esc(b.batch_no)}</span>`, 'lead nowrap')}
            ${td('Date', moneyDate(b.ht_date), 'nowrap')}
            ${td('Furnace', esc(b.furnace_no || '—'))}
            ${td('Process', `${esc(b.process_type || '—')}${b.temperature_c ? `<span class="sub">${fmt(b.temperature_c)}°C${b.soak_hours ? ` · target ${fmt(b.soak_hours)} h` : ''}</span>` : ''}`)}
            ${td('Orders', new Set(items.map(i => i.order_uuid)).size, 'num')}
            ${td('Out / Pcs', `<span class="strong">${sum(items.filter(i => i.time_out), i => i.qty)}</span> / ${sum(items, i => i.qty)}`, 'num')}
            ${td('Batch Time', sp ? (sp.open ? `<span class="live" data-since="${new Date(sp.start).toISOString()}" data-target="0">${durText(sp.ms)}</span>` : `<span class="dur">${durText(sp.ms)}</span>`) : '—')}
            ${td('Status', pill(b.status))}
            ${td('Actions', `<div class="actions" onclick="event.stopPropagation()">${actBtn('ghost', 'history', 'View batch', `showHTBatch('${b.id}')`, true)}</div>`, 'act')}
          </tr>`;
        }), 'No furnace batches yet.');
    }

    function htUsage(bid) { return state.ht_usage.filter(u => u.ht_batch_id === bid).map(u => ({ id: u.consumable_id, name: u.consumable_name, unit: u.unit_of_measurement, qty: u.qty })); }

    function showHTBatch(bid) {
      const b = htBatch(bid);
      if (!b) return closeModal();
      const items = htItemsOfBatch(bid).sort((x, y) => x.time_in.localeCompare(y.time_in));
      const open = items.filter(i => !i.time_out);
      const sp = batchSpan(bid);
      modal(`Furnace Batch · ${esc(b.batch_no)}`, `
        ${summary([['Pieces', sum(items, i => i.qty)], ['Out', sum(items.filter(i => i.time_out), i => i.qty)], ['In Furnace', sum(open, i => i.qty)], ['Batch Time', sp ? durText(sp.ms) : '—'], ['Status', pill(b.status)]])}
        <div class="row-meta">${moneyDate(b.ht_date)} · Furnace <b>${esc(b.furnace_no || '—')}</b> · <b>${esc(b.process_type || '—')}</b>${b.temperature_c ? ` at <b>${fmt(b.temperature_c)}°C</b>` : ''}${b.soak_hours ? ` · Target <b>${fmt(b.soak_hours)} h</b>` : ''} · ${esc(b.operator_name || 'Operator not set')}${b.remarks ? `<br>${esc(b.remarks)}` : ''}</div>
        <div class="section-label">Products in this batch (${items.length})</div>
        <div class="table-wrap">${htItemsTable(items, 'No castings in this batch.', true)}</div>
        <div class="section-label">Heat treatment consumables</div>${usageTable(htUsage(bid), 'No consumables recorded.')}
        <div class="form-actions" style="margin-top:16px">
          <button class="btn danger" onclick="deleteHTBatch('${bid}')">${icon('trash', 'sm')}<span>Delete</span></button>
          <button class="btn ghost" onclick="openHTBatchForm(null,'${bid}')">${icon('edit', 'sm')}<span>Edit Batch</span></button>
          ${sendBtnOrders().length ? `<button class="btn secondary" onclick="openHTItemForm('${bid}')">${icon('plus', 'sm')}<span>Add Castings</span></button>` : ''}
          ${open.length ? `<button class="btn primary" onclick="unloadAll('${bid}')">${icon('unload', 'sm')}<span>Unload All Now</span></button>` : ''}
        </div>`, true);
    }

    function htOrderOptions(selected) {
      return sendBtnOrders().map(o => `<option value="${o.id}" data-max="${htWaiting(o.id)}" ${o.id === selected ? 'selected' : ''}>${esc(o.order_id)} · ${esc(o.model_name)} (${htWaiting(o.id)} waiting)</option>`).join('');
    }
    function addHTLine(orderId) {
      const box = document.getElementById('lines_htitems');
      if (!box) return;
      const row = document.createElement('div');
      row.className = 'line';
      row.innerHTML = `<select onchange="htLineMax(this)"><option value="">Select order / product</option>${htOrderOptions()}</select>
        <input type="number" min="1" step="1" placeholder="Pcs">
        <button type="button" class="btn small danger icon-only" onclick="this.parentNode.remove()" title="Remove line" aria-label="Remove line">${icon('close', 'sm')}</button>`;
      box.appendChild(row);
      if (orderId) { row.querySelector('select').value = orderId; htLineMax(row.querySelector('select')); }
    }
    function htLineMax(sel) {
      const max = sel.selectedOptions[0]?.dataset.max;
      const input = sel.parentNode.querySelector('input');
      input.placeholder = max ? `Pcs (max ${max})` : 'Pcs';
      if (max) input.value = max;
    }
    function collectHTLines() {
      const out = {};
      for (const row of document.querySelectorAll('#lines_htitems .line')) {
        const sel = row.querySelector('select');
        const qty = Math.floor(num(row.querySelector('input').value));
        if (!sel.value && !qty) continue;
        if (!sel.value || qty <= 0) { toast('Every line needs an order and pieces above 0', true); return null; }
        out[sel.value] = (out[sel.value] || 0) + qty;
      }
      for (const [oid, qty] of Object.entries(out)) {
        if (qty > htWaiting(oid)) { toast(`${orderById(oid).order_id}: only ${htWaiting(oid)} castings are waiting`, true); return null; }
      }
      return Object.entries(out).map(([order, qty]) => ({ order, qty }));
    }

    function openHTBatchForm(orderId, batchId) {
      const b = batchId ? htBatch(batchId) : { ht_date: localToday(), process_type: HT_PROCESSES[0] };
      if (!batchId && !sendBtnOrders().length) return toast('No poured castings are waiting for heat treatment', true);
      modal(batchId ? `Edit Batch ${esc(b.batch_no)}` : 'New Furnace Batch', `<form class="form-grid" onsubmit="saveHTBatch(event,'${batchId || ''}')">
        <div class="field"><label>Batch No</label><input value="${esc(b.batch_no || 'Auto: HTB-000001')}" disabled></div>
        ${field('furnace_no', 'Furnace No', b.furnace_no || '', 'text')}
        ${selectField('process_type', 'HT Process', b.process_type, HT_PROCESSES)}
        ${field('temperature_c', 'Temperature (°C)', b.temperature_c ?? '', 'number')}
        ${field('soak_hours', 'Target Soak Time (hours)', b.soak_hours ?? '', 'number')}
        ${field('ht_date', 'Batch Date', b.ht_date, 'date', true)}
        ${field('operator_name', 'HT Operator', b.operator_name || '', 'text')}
        ${batchId ? '' : field('time_in', 'Furnace In Time', toLocalInput(), 'datetime-local', true)}
        ${batchId ? '' : `<div class="field full"><div class="line-head"><label>Castings Loaded <span class="req">*</span></label><button type="button" class="btn small secondary" onclick="addHTLine()">${icon('plus', 'sm')}<span>Add order</span></button></div><div class="lines" id="lines_htitems"></div><div class="hint">Each product gets its own Out time — unload them one by one from the batch.</div></div>`}
        ${lineBlock('lines_ht', 'Heat Treatment Consumables (Oil, Gas…)', 'ht', 'Add consumable')}
        ${field('remarks', 'Remarks', b.remarks || '', 'textarea')}
        ${formActions(batchId ? 'Update Batch' : 'Load in Furnace')}</form>`);
      if (!batchId) addHTLine(orderId);
      const usage = batchId ? htUsage(batchId) : [];
      (usage.length ? usage : [{}]).forEach(u => addLine('lines_ht', 'ht', u));
      if (!lineOptions('ht')) toast('No active Heat Treatment consumables in master. Add Oil / Gas in Consumables Master.', true);
    }

    async function saveHTBatch(event, batchId) {
      event.preventDefault();
      if (!validate(['ht_date', ...(batchId ? [] : ['time_in'])])) return;
      const con = collectLines('lines_ht');
      if (!con) return;
      const items = batchId ? [] : collectHTLines();
      if (!items) return;
      if (!batchId && !items.length) return toast('Add at least one order with pieces', true);
      const payload = {
        furnace_no: val('furnace_no') || null, process_type: val('process_type'), ht_date: val('ht_date'), operator_name: val('operator_name') || null, remarks: val('remarks') || null,
        temperature_c: val('temperature_c') === '' ? null : num(val('temperature_c')), soak_hours: val('soak_hours') === '' ? null : num(val('soak_hours'))
      };
      try {
        let id = batchId;
        if (batchId) {
          await request(`ht_batches?id=eq.${batchId}`, { method: 'PATCH', body: JSON.stringify(payload) });
          await request(`ht_consumable_usage?ht_batch_id=eq.${batchId}`, { method: 'DELETE' });
        } else {
          const [created] = await request('ht_batches', { method: 'POST', headers: REP, body: JSON.stringify(payload) });
          id = created.id;
          const timeIn = fromLocalInput(val('time_in'));
          try {
            await request('ht_items', { method: 'POST', body: JSON.stringify(items.map(i => ({ ht_batch_id: id, order_uuid: i.order, qty: i.qty, time_in: timeIn }))) });
          } catch (err) {
            await request(`ht_batches?id=eq.${id}`, { method: 'DELETE' }).catch(() => {});
            throw err;
          }
        }
        if (con.length) await request('ht_consumable_usage', { method: 'POST', body: JSON.stringify(con.map(l => ({ ht_batch_id: id, consumable_id: l.id, consumable_name: l.name, unit_of_measurement: l.unit, qty: l.qty }))) });
        closeModal();
        await refreshAll();
        toast(batchId ? 'Batch updated' : `${sum(items, i => i.qty)} castings loaded in furnace`);
      } catch (error) { toast(error.message, true); }
    }

    function openHTItemForm(batchId, itemId) {
      const b = htBatch(batchId);
      const i = state.ht_items.find(x => x.id === itemId);
      const o = i ? orderById(i.order_uuid) : null;
      modal(`${i ? 'Edit Product Time' : 'Add Castings'} · ${esc(b.batch_no)}`, `<form class="form-grid" onsubmit="saveHTItem(event,'${batchId}','${itemId || ''}')">
        ${i ? ctxBox(o, `Batch ${esc(b.batch_no)} · ${esc(b.process_type || '')}`)
            : `<div class="field full" data-field="ht_order"><label for="ht_order">Order / Product <span class="req">*</span></label><select id="ht_order" onchange="document.getElementById('ht_qty').value=this.selectedOptions[0]?.dataset.max||''"><option value="">Select order</option>${htOrderOptions()}</select><div class="error">Order is required</div></div>`}
        ${field('ht_qty', 'Pieces', i ? i.qty : '', 'number', true)}
        ${field('time_in', 'Furnace In Time', toLocalInput(i?.time_in), 'datetime-local', true)}
        ${field('time_out', 'Furnace Out Time', i?.time_out ? toLocalInput(i.time_out) : '', 'datetime-local')}
        ${field('remarks', 'Remarks', i?.remarks || '', 'textarea')}
        <div class="field full hint">Leave Out Time empty while the product is still in the furnace.</div>
        ${formActions(i ? 'Save Times' : 'Add to Batch')}</form>`);
    }

    async function saveHTItem(event, batchId, itemId) {
      event.preventDefault();
      if (!validate(['ht_qty', 'time_in', ...(itemId ? [] : ['ht_order'])])) return;
      const i = state.ht_items.find(x => x.id === itemId);
      const oid = i ? i.order_uuid : val('ht_order');
      const qty = Math.floor(num(val('ht_qty')));
      const tIn = fromLocalInput(val('time_in'));
      const tOut = fromLocalInput(val('time_out'));
      const max = htWaiting(oid) + num(i?.qty);
      if (qty <= 0) return toast('Pieces must be more than 0', true);
      if (qty > max) return toast(`Only ${max} castings are available for this order`, true);
      if (tOut && tOut < tIn) return toast('Out time cannot be before In time', true);
      const payload = { qty, time_in: tIn, time_out: tOut, remarks: val('remarks') || null };
      try {
        if (i) await request(`ht_items?id=eq.${itemId}`, { method: 'PATCH', body: JSON.stringify(payload) });
        else await request('ht_items', { method: 'POST', body: JSON.stringify({ ...payload, ht_batch_id: batchId, order_uuid: oid }) });
        await refreshAll();
        toast(i ? 'Times updated' : 'Castings added to batch');
        showHTBatch(batchId);
      } catch (error) { toast(error.message, true); }
    }

    async function unloadHTItem(itemId, reopen) {
      const i = state.ht_items.find(x => x.id === itemId);
      try {
        await request(`ht_items?id=eq.${itemId}`, { method: 'PATCH', body: JSON.stringify({ time_out: new Date().toISOString() }) });
        await refreshAll();
        const done = state.ht_items.find(x => x.id === itemId);
        toast(`${num(i.qty)} pcs ${orderById(i.order_uuid)?.model_name || ''} unloaded · HT time ${durText(itemDur(done || i))}`);
        if (reopen) showHTBatch(i.ht_batch_id);
      } catch (error) { toast(error.message, true); }
    }

    async function unloadAll(batchId) {
      if (!confirm('Unload every product still in this batch with the current time?')) return;
      try {
        await request(`ht_items?ht_batch_id=eq.${batchId}&time_out=is.null`, { method: 'PATCH', body: JSON.stringify({ time_out: new Date().toISOString() }) });
        await refreshAll();
        toast('All products unloaded');
        showHTBatch(batchId);
      } catch (error) { toast(error.message, true); }
    }

    function htRemovalBlocked(items) {
      const byOrder = {};
      items.filter(i => i.time_out).forEach(i => { byOrder[i.order_uuid] = (byOrder[i.order_uuid] || 0) + num(i.qty); });
      return Object.entries(byOrder).find(([oid, q]) => htDone(oid) - q < fettledOk(oid) + fettledRej(oid));
    }

    async function deleteHTItem(itemId) {
      const i = state.ht_items.find(x => x.id === itemId);
      if (htRemovalBlocked([i])) return toast('Cannot remove: these pieces are already fettled', true);
      if (!confirm(`Remove ${i.qty} pcs from this batch? They will go back to "Waiting".`)) return;
      try {
        await request(`ht_items?id=eq.${itemId}`, { method: 'DELETE' });
        await refreshAll();
        toast('Removed from batch');
        showHTBatch(i.ht_batch_id);
      } catch (error) { toast(error.message, true); }
    }

    async function deleteHTBatch(batchId) {
      if (htRemovalBlocked(htItemsOfBatch(batchId))) return toast('Cannot delete: pieces from this batch are already fettled', true);
      if (!confirm('Delete this furnace batch? Its castings will go back to "Waiting".')) return;
      try {
        await request(`ht_batches?id=eq.${batchId}`, { method: 'DELETE' });
        closeModal();
        await refreshAll();
        toast('Batch deleted');
      } catch (error) { toast(error.message, true); }
    }

    /* ========================= FETTLING & FINISHING ========================= */
    function renderFettling() {
      if (!flowGuard('fettling', 'Fettling & Finishing')) return;
      const q = (state.search.fettling || '').toLowerCase();
      const tab = state.filter.fettling;
      const orders = state.orders.filter(o => FLOW_ORDER(o) && htDone(o.id) > 0);
      const rows = orders.filter(o => (tab === 'All' || fettleWaiting(o.id) > 0) && orderMatch(o, q));
      const ok = sum(state.fettling_entries, e => e.qty_ok);
      const rej = sum(state.fettling_entries, e => e.qty_rejected);
      const todayOk = sum(state.fettling_entries.filter(e => e.entry_date === localToday()), e => e.qty_ok);
      const recent = state.fettling_entries.slice(0, 10);
      document.getElementById('fettling').innerHTML =
        header('Fettling & Finishing', 'Heat-treated castings — grinding, welding, painting and final finishing') +
        statCards([['Waiting (pcs)', sum(orders, o => fettleWaiting(o.id)), 'clock', 'amber'], ['Finished Today', todayOk, 'status', 'teal'], ['Total Finished', ok, 'check', 'green'],
          ['Rejected', rej, 'close', 'red'], ['Rejection %', ok + rej ? `${(rej / (ok + rej) * 100).toFixed(1)}%` : '—', 'weight', 'orange'], ['In Stock', sum(state.orders.filter(FLOW_ORDER), o => stockQty(o.id)), 'stock', 'blue']]) +
        `<div style="margin-bottom:14px">${tabs('fettling', ['Waiting', 'All'], 'renderFettling', { Waiting: orders.filter(o => fettleWaiting(o.id) > 0).length, All: orders.length })}</div>` +
        tablePanel('Fettling Queue', rows.length, searchBox('fettling', 'Search order, model or customer', 'renderFettling'),
          dataTable([['Order', ''], ['Product / Customer', ''], ['Delivery', ''], ['Order Qty', 'num'], ['HT Done', 'num'], ['Finished', 'num'], ['Rejected', 'num'], ['Waiting', 'num'], ['Progress', 'wide'], ['Actions', 'act']],
            rows.map(o => `<tr class="click" onclick="showFettlingHistory('${o.id}')">
              ${td('Order', `<span class="mono">${esc(o.order_id)}</span>`, 'lead nowrap')}
              ${td('Product', orderCell(o))}
              ${td('Delivery', dueDate(o), 'nowrap')}
              ${td('Order Qty', esc(o.quantity), 'num')}
              ${td('HT Done', htDone(o.id), 'num')}
              ${td('Finished', `<span class="strong">${fettledOk(o.id)}</span>`, 'num')}
              ${td('Rejected', fettledRej(o.id) ? `<span class="late">${fettledRej(o.id)}</span>` : 0, 'num')}
              ${td('Waiting', `<span class="strong">${fettleWaiting(o.id)}</span>`, 'num')}
              ${td('Progress', progress(fettledOk(o.id), num(o.quantity)))}
              ${td('Actions', `<div class="actions" onclick="event.stopPropagation()">
                ${fettleWaiting(o.id) ? actBtn('primary', 'plus', 'Add Finished', `openFettlingEntry('${o.id}')`) : ''}
                ${actBtn('ghost', 'history', 'History', `showFettlingHistory('${o.id}')`, true)}
              </div>`, 'act')}
            </tr>`), orders.length ? 'Nothing waiting in this view.' : 'No heat-treated castings yet. Products appear here after they are unloaded from the furnace.')) +
        tablePanel('Recent Finishing Entries', recent.length, '', fettleEntriesTable(recent, true));
    }

    function fettleUsage(filterFn) { return state.fettling_usage.filter(filterFn).map(u => ({ name: u.consumable_name, unit: u.unit_of_measurement, qty: u.qty })); }

    function fettleEntriesTable(list, withOrder, orderIdForDelete) {
      return dataTable([['Date', ''], ...(withOrder ? [['Order / Product', '']] : []), ['OK', 'num'], ['Rejected', 'num'], ['Operator', ''], ['Consumables', ''], ...(withOrder ? [] : [['', 'act']])],
        list.map(e => {
          const o = orderById(e.order_uuid) || {};
          return `<tr ${withOrder ? `class="click" onclick="showFettlingHistory('${e.order_uuid}')"` : ''}>
            ${td('Date', `<span class="strong">${moneyDate(e.entry_date)}</span>`, 'lead nowrap')}
            ${withOrder ? td('Order', `<span class="mono">${esc(o.order_id || '—')}</span><span class="sub">${esc(o.model_name || '')}</span>`) : ''}
            ${td('OK', `<span class="strong">${num(e.qty_ok)}</span>`, 'num')}
            ${td('Rejected', num(e.qty_rejected) ? `<span class="late">${num(e.qty_rejected)}</span>` : 0, 'num')}
            ${td('Operator', esc(e.operator_name || '—'))}
            ${td('Consumables', usageChips(fettleUsage(u => u.fettling_entry_id === e.id)))}
            ${withOrder ? '' : td('', `<div class="actions">${actBtn('danger', 'trash', 'Delete entry', `deleteFettlingEntry('${e.id}')`, true)}</div>`, 'act')}
          </tr>`;
        }), 'No finishing entries yet.');
    }

    function openFettlingEntry(orderId) {
      const o = orderById(orderId);
      const waiting = fettleWaiting(orderId);
      modal(`Fettling & Finishing · ${esc(o.order_id)}`, `<form class="form-grid" onsubmit="saveFettlingEntry(event,'${orderId}')">
        ${ctxBox(o, `Heat treated: <b>${htDone(orderId)}</b> · Finished: <b>${fettledOk(orderId)}</b> · Waiting: <b>${waiting}</b>`)}
        ${field('qty_ok', 'Finished OK (pcs)', waiting, 'number', true)}
        ${field('qty_rejected', 'Rejected (pcs)', 0, 'number')}
        ${field('entry_date', 'Work Date', localToday(), 'date', true)}
        ${field('operator_name', 'Fettling Person', '', 'text')}
        ${lineBlock('lines_fettle', 'Fettling & Finishing Consumables (discs, rods, paint…)', 'fettle', 'Add consumable')}
        ${field('remarks', 'Remarks / Rejection reason', '', 'textarea')}
        ${formActions('Save Entry')}</form>`);
      addLine('lines_fettle', 'fettle');
      if (!lineOptions('fettle')) toast('No active Fettling consumables in master. Add them in Consumables Master.', true);
    }

    async function saveFettlingEntry(event, orderId) {
      event.preventDefault();
      if (!validate(['qty_ok', 'entry_date'])) return;
      const ok = Math.floor(num(val('qty_ok')));
      const rej = Math.floor(num(val('qty_rejected')));
      const waiting = fettleWaiting(orderId);
      if (ok + rej <= 0) return toast('Enter finished or rejected pieces', true);
      if (ok + rej > waiting) return toast(`Only ${waiting} heat-treated pieces are waiting`, true);
      const lines = collectLines('lines_fettle');
      if (!lines) return;
      try {
        const [entry] = await request('fettling_entries', { method: 'POST', headers: REP, body: JSON.stringify({ order_uuid: orderId, entry_date: val('entry_date'), qty_ok: ok, qty_rejected: rej, operator_name: val('operator_name') || null, remarks: val('remarks') || null }) });
        if (lines.length) await request('fettling_consumable_usage', { method: 'POST', body: JSON.stringify(lines.map(l => ({ fettling_entry_id: entry.id, order_uuid: orderId, consumable_id: l.id, consumable_name: l.name, unit_of_measurement: l.unit, qty: l.qty }))) });
        closeModal();
        await refreshAll();
        toast(`${ok} pcs finished${rej ? `, ${rej} rejected` : ''} — added to stock`);
      } catch (error) { toast(error.message, true); }
    }

    function showFettlingHistory(orderId) {
      const o = orderById(orderId);
      const entries = fettleFor(orderId);
      modal(`Finishing History · ${esc(o.order_id)}`, `
        ${summary([['HT Done', htDone(orderId)], ['Finished', fettledOk(orderId)], ['Rejected', fettledRej(orderId)], ['Waiting', fettleWaiting(orderId)], ['Dispatched', dispatchedQty(orderId)]])}
        ${progress(fettledOk(orderId), num(o.quantity))}
        <div class="section-label">Total consumables used</div>${usageTable(totalsByItem(fettleUsage(u => u.order_uuid === orderId)), 'No consumables recorded.')}
        <div class="section-label">Entries (${entries.length})</div>
        ${fettleEntriesTable(entries, false)}
        <div class="form-actions" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">Close</button>${fettleWaiting(orderId) ? `<button class="btn primary" onclick="openFettlingEntry('${orderId}')">${icon('plus', 'sm')}<span>Add Finished</span></button>` : ''}</div>`);
    }

    async function deleteFettlingEntry(entryId) {
      const e = state.fettling_entries.find(x => x.id === entryId);
      if (fettledOk(e.order_uuid) - num(e.qty_ok) < dispatchedQty(e.order_uuid)) return toast('Cannot delete: these pieces are already dispatched', true);
      if (!confirm(`Delete this entry (${e.qty_ok} OK, ${e.qty_rejected} rejected)?`)) return;
      try {
        await request(`fettling_entries?id=eq.${entryId}`, { method: 'DELETE' });
        await refreshAll();
        toast('Entry deleted');
        showFettlingHistory(e.order_uuid);
      } catch (error) { toast(error.message, true); }
    }

    /* ============================ STOCK INVENTORY ============================ */
    function stageOf(o) {
      if (o.status === 'Delivered' || (num(o.quantity) > 0 && dispatchedQty(o.id) >= num(o.quantity))) return pill('Delivered');
      if (stockQty(o.id) > 0) return pill('In Stock');
      if (fettleWaiting(o.id) > 0) return pill('Fettling');
      if (htInFurnace(o.id) > 0) return pill('In Furnace');
      if (htWaiting(o.id) > 0) return pill('Waiting HT', 'WaitingHT');
      if (batchesFor(o.id).length || availableMolds(o.id) > 0) return pill('Melting');
      if (num(jobFor(o.id)?.molds_made) > 0) return pill('Molding', 'InProgress');
      return pill('Not Started');
    }

    function renderStock() {
      if (!flowGuard('stock', 'Stock Inventory')) return;
      const q = (state.search.stock || '').toLowerCase();
      const tab = state.filter.stock;
      const orders = state.orders.filter(FLOW_ORDER);
      const inStock = orders.filter(o => stockQty(o.id) > 0);
      const wip = sum(orders, o => Math.max(pouredDone(o.id) - fettledOk(o.id) - fettledRej(o.id), 0));
      const byProduct = {};
      orders.filter(o => fettledOk(o.id) > 0).forEach(o => {
        const k = o.product_id || o.model_id;
        const r = byProduct[k] = byProduct[k] || { o, orders: 0, finished: 0, sent: 0, stock: 0 };
        r.orders++; r.finished += fettledOk(o.id); r.sent += dispatchedQty(o.id); r.stock += stockQty(o.id);
      });
      let body;
      if (tab === 'By Product') {
        const rows = Object.values(byProduct).filter(r => `${r.o.model_name} ${r.o.model_id}`.toLowerCase().includes(q)).sort((a, b) => b.stock - a.stock);
        body = tablePanel('Finished stock by product', rows.length, searchBox('stock', 'Search product or model', 'renderStock'),
          dataTable([['Product', ''], ['Orders', 'num'], ['Finished', 'num'], ['Dispatched', 'num'], ['In Stock', 'num']],
            rows.map(r => `<tr>${td('Product', prodCell(r.o.product_image_url, r.o.model_name, r.o.model_id), 'lead')}${td('Orders', r.orders, 'num')}${td('Finished', r.finished, 'num')}${td('Dispatched', r.sent, 'num')}${td('In Stock', `<span class="strong">${r.stock}</span>`, 'num')}</tr>`),
            'No finished products yet.'));
      } else if (tab === 'Pipeline') {
        const rows = orders.filter(o => o.status !== 'Delivered' && orderMatch(o, q));
        body = tablePanel('Where every order is (pieces at each stage)', rows.length, searchBox('stock', 'Search order, model or customer', 'renderStock'),
          dataTable([['Order', ''], ['Product / Customer', ''], ['Qty', 'num'], ['Molds', 'num'], ['Poured', 'num'], ['Wait HT', 'num'], ['In Furnace', 'num'], ['Fettling', 'num'], ['Finished', 'num'], ['Rejected', 'num'], ['Dispatched', 'num'], ['Stage', '']],
            rows.map(o => `<tr class="click" onclick="showOrderDetail('${o.id}')">
              ${td('Order', `<span class="mono">${esc(o.order_id)}</span>`, 'lead nowrap')}
              ${td('Product', orderCell(o))}
              ${td('Qty', `<span class="strong">${esc(o.quantity)}</span>`, 'num')}
              ${td('Molds', num(jobFor(o.id)?.molds_made), 'num')}
              ${td('Poured', pouredDone(o.id), 'num')}
              ${td('Wait HT', htWaiting(o.id), 'num')}
              ${td('In Furnace', htInFurnace(o.id), 'num')}
              ${td('Fettling', fettleWaiting(o.id), 'num')}
              ${td('Finished', fettledOk(o.id), 'num')}
              ${td('Rejected', fettledRej(o.id), 'num')}
              ${td('Dispatched', dispatchedQty(o.id), 'num')}
              ${td('Stage', stageOf(o))}
            </tr>`), 'No open orders.'));
      } else {
        const rows = orders.filter(o => fettledOk(o.id) > 0 && orderMatch(o, q)).sort((a, b) => stockQty(b.id) - stockQty(a.id));
        body = tablePanel('Finished stock by order', rows.length, searchBox('stock', 'Search order, model or customer', 'renderStock'),
          dataTable([['Order', ''], ['Product / Customer', ''], ['Delivery', ''], ['Order Qty', 'num'], ['Finished', 'num'], ['Dispatched', 'num'], ['In Stock', 'num'], ['Balance to Make', 'num'], ['Actions', 'act']],
            rows.map(o => `<tr class="click" onclick="showOrderDetail('${o.id}')">
              ${td('Order', `<span class="mono">${esc(o.order_id)}</span>`, 'lead nowrap')}
              ${td('Product', orderCell(o))}
              ${td('Delivery', dueDate(o), 'nowrap')}
              ${td('Order Qty', esc(o.quantity), 'num')}
              ${td('Finished', fettledOk(o.id), 'num')}
              ${td('Dispatched', dispatchedQty(o.id), 'num')}
              ${td('In Stock', `<span class="strong">${stockQty(o.id)}</span>`, 'num')}
              ${td('Balance to Make', Math.max(num(o.quantity) - fettledOk(o.id), 0), 'num')}
              ${td('Actions', `<div class="actions" onclick="event.stopPropagation()">${stockQty(o.id) ? actBtn('primary', 'dispatch', 'Dispatch', `navigate('dispatch'); openDispatchForm('${o.id}')`) : pill('Dispatched')}</div>`, 'act')}
            </tr>`), 'No finished products yet. Stock is added from Fettling & Finishing.'));
      }
      document.getElementById('stock').innerHTML =
        header('Stock Inventory', 'Ready finished products — added from Fettling, reduced by Dispatch') +
        statCards([['In Stock (pcs)', sum(inStock, o => stockQty(o.id)), 'stock', 'green'], ['Orders with Stock', inStock.length, 'orders', 'orange'], ['Products in Stock', Object.values(byProduct).filter(r => r.stock > 0).length, 'products', 'blue'],
          ['Work in Progress (pcs)', wip, 'melting', 'amber'], ['Dispatched (pcs)', sum(state.dispatches, d => d.qty), 'dispatch', 'teal'], ['Rejected (pcs)', sum(state.fettling_entries, e => e.qty_rejected), 'close', 'red']]) +
        `<div style="margin-bottom:14px">${tabs('stock', ['By Order', 'By Product', 'Pipeline'], 'renderStock')}</div>` + body;
    }

    /* ================================ DISPATCH ================================ */
    function renderDispatch() {
      if (!flowGuard('dispatch', 'Dispatch')) return;
      const q = (state.search.dispatch || '').toLowerCase();
      const ready = state.orders.filter(o => FLOW_ORDER(o) && stockQty(o.id) > 0);
      const list = state.dispatches.filter(d => { const o = orderById(d.order_uuid) || {}; return `${d.dispatch_no} ${d.challan_no || ''} ${d.vehicle_no || ''} ${o.order_id} ${o.model_name} ${o.customer_name}`.toLowerCase().includes(q); });
      const todayQ = sum(state.dispatches.filter(d => d.dispatch_date === localToday()), d => d.qty);
      document.getElementById('dispatch').innerHTML =
        header('Dispatch', 'Send finished stock to customers with challan and vehicle details') +
        statCards([['Ready to Dispatch (pcs)', sum(ready, o => stockQty(o.id)), 'stock', 'green'], ['Orders Ready', ready.length, 'orders', 'orange'], ['Dispatched Today (pcs)', todayQ, 'dispatch', 'teal'],
          ['Total Dispatched (pcs)', sum(state.dispatches, d => d.qty), 'check', 'blue'], ['Dispatches', state.dispatches.length, 'history', 'amber'], ['Orders Delivered', state.orders.filter(o => o.status === 'Delivered').length, 'flag', 'green']]) +
        tablePanel('Ready to Dispatch', ready.length, '',
          dataTable([['Order', ''], ['Product / Customer', ''], ['Delivery', ''], ['Order Qty', 'num'], ['Dispatched', 'num'], ['In Stock', 'num'], ['Progress', 'wide'], ['Actions', 'act']],
            ready.map(o => `<tr>
              ${td('Order', `<span class="mono">${esc(o.order_id)}</span>`, 'lead nowrap')}
              ${td('Product', orderCell(o))}
              ${td('Delivery', dueDate(o), 'nowrap')}
              ${td('Order Qty', esc(o.quantity), 'num')}
              ${td('Dispatched', dispatchedQty(o.id), 'num')}
              ${td('In Stock', `<span class="strong">${stockQty(o.id)}</span>`, 'num')}
              ${td('Progress', progress(dispatchedQty(o.id), num(o.quantity)))}
              ${td('Actions', `<div class="actions">${actBtn('primary', 'dispatch', 'Dispatch', `openDispatchForm('${o.id}')`)}</div>`, 'act')}
            </tr>`), 'No finished stock to dispatch.')) +
        tablePanel('Dispatch Register', list.length, searchBox('dispatch', 'Search dispatch no, challan, vehicle, order', 'renderDispatch'),
          dataTable([['Dispatch No', ''], ['Date', ''], ['Order / Product', ''], ['Customer', ''], ['Qty', 'num'], ['Challan / Invoice', ''], ['Vehicle / Driver', ''], ['Actions', 'act']],
            list.map(d => {
              const o = orderById(d.order_uuid) || {};
              return `<tr>
                ${td('Dispatch No', `<span class="mono">${esc(d.dispatch_no)}</span>`, 'lead nowrap')}
                ${td('Date', moneyDate(d.dispatch_date), 'nowrap')}
                ${td('Order', `<span class="mono">${esc(o.order_id || '—')}</span><span class="sub">${esc(o.model_name || '')}</span>`)}
                ${td('Customer', `<span class="strong">${esc(o.customer_name || '—')}</span>`)}
                ${td('Qty', `<span class="strong">${num(d.qty)}</span>`, 'num')}
                ${td('Challan', `${esc(d.challan_no || '—')}${d.invoice_no ? `<span class="sub">Inv ${esc(d.invoice_no)}</span>` : ''}`)}
                ${td('Vehicle', `${esc(d.vehicle_no || '—')}${d.driver_name ? `<span class="sub">${esc(d.driver_name)}${d.driver_mobile ? ` · ${esc(d.driver_mobile)}` : ''}</span>` : ''}`)}
                ${td('Actions', `<div class="actions">${actBtn('secondary', 'print', 'Challan', `printChallan('${d.id}')`)}${actBtn('ghost', 'edit', 'Edit', `openDispatchForm('${d.order_uuid}','${d.id}')`, true)}${actBtn('danger', 'trash', 'Delete', `deleteDispatch('${d.id}')`, true)}</div>`, 'act')}
              </tr>`;
            }), 'No dispatches yet.'));
    }

    function openDispatchForm(orderId, dispatchId) {
      const o = orderById(orderId);
      const d = state.dispatches.find(x => x.id === dispatchId) || { dispatch_date: localToday() };
      const max = stockQty(orderId) + num(d.qty);
      modal(`${dispatchId ? 'Edit Dispatch ' + esc(d.dispatch_no) : 'New Dispatch'} · ${esc(o.order_id)}`, `<form class="form-grid" onsubmit="saveDispatch(event,'${orderId}','${dispatchId || ''}')">
        ${ctxBox(o, `In stock: <b>${max}</b> · Already dispatched: <b>${dispatchedQty(orderId) - num(d.qty)}</b> of ${esc(o.quantity)}`)}
        <div class="field"><label>Dispatch No</label><input value="${esc(d.dispatch_no || 'Auto: DSP-000001')}" disabled></div>
        ${field('dispatch_date', 'Dispatch Date', d.dispatch_date, 'date', true)}
        <div class="field" data-field="dqty"><label for="dqty">Quantity (pcs) <span class="req">*</span></label><input id="dqty" type="number" min="1" max="${max}" step="1" value="${esc(dispatchId ? d.qty : max)}"><div class="hint">Max ${max}</div><div class="error">Quantity is required</div></div>
        ${field('challan_no', 'Challan No', d.challan_no || '', 'text')}
        ${field('invoice_no', 'Invoice No', d.invoice_no || '', 'text')}
        ${field('vehicle_no', 'Vehicle No', d.vehicle_no || '', 'text')}
        ${field('transporter', 'Transporter', d.transporter || '', 'text')}
        ${field('driver_name', 'Driver Name', d.driver_name || '', 'text')}
        ${field('driver_mobile', 'Driver Mobile', d.driver_mobile || '', 'tel')}
        ${field('remarks', 'Remarks', d.remarks || '', 'textarea')}
        ${formActions(dispatchId ? 'Update Dispatch' : 'Dispatch')}</form>`);
    }

    async function saveDispatch(event, orderId, dispatchId) {
      event.preventDefault();
      if (!validate(['dispatch_date', 'dqty'])) return;
      const d = state.dispatches.find(x => x.id === dispatchId);
      const max = stockQty(orderId) + num(d?.qty);
      const qty = Math.floor(num(val('dqty')));
      if (qty <= 0) return toast('Quantity must be more than 0', true);
      if (qty > max) return toast(`Only ${max} pcs are in stock`, true);
      const payload = { order_uuid: orderId, dispatch_date: val('dispatch_date'), qty, challan_no: val('challan_no') || null, invoice_no: val('invoice_no') || null, vehicle_no: val('vehicle_no') || null, transporter: val('transporter') || null, driver_name: val('driver_name') || null, driver_mobile: val('driver_mobile') || null, remarks: val('remarks') || null };
      try {
        let saved;
        if (dispatchId) [saved] = await request(`dispatches?id=eq.${dispatchId}`, { method: 'PATCH', headers: REP, body: JSON.stringify(payload) });
        else [saved] = await request('dispatches', { method: 'POST', headers: REP, body: JSON.stringify(payload) });
        closeModal();
        await refreshAll();
        const o = orderById(orderId);
        toast(`${saved.dispatch_no}: ${qty} pcs dispatched${o?.status === 'Delivered' ? ' — order Delivered' : ''}`);
      } catch (error) { toast(error.message, true); }
    }

    async function deleteDispatch(id) {
      const d = state.dispatches.find(x => x.id === id);
      if (!confirm(`Delete dispatch ${d.dispatch_no}? ${d.qty} pcs will return to stock.`)) return;
      try {
        await request(`dispatches?id=eq.${id}`, { method: 'DELETE' });
        await refreshAll();
        toast('Dispatch deleted — stock restored');
      } catch (error) { toast(error.message, true); }
    }

    function printChallan(id) {
      const d = state.dispatches.find(x => x.id === id);
      const o = orderById(d.order_uuid) || {};
      const w = window.open('', '_blank');
      if (!w) return toast('Allow pop-ups to print the challan', true);
      const row = (k, v) => `<tr><th>${k}</th><td>${esc(v || '—')}</td></tr>`;
      w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Delivery Challan ${esc(d.dispatch_no)}</title><style>
        body{font-family:Arial,sans-serif;color:#111;margin:32px;max-width:760px}h1{font-size:22px;margin:0}h2{font-size:14px;color:#555;margin:4px 0 20px;font-weight:normal}
        table{width:100%;border-collapse:collapse;margin-bottom:18px}th,td{border:1px solid #bbb;padding:8px 10px;text-align:left;font-size:13px}th{background:#f3f3f3;width:32%}
        .items th{width:auto}.sign{display:flex;justify-content:space-between;margin-top:60px;font-size:13px}.sign div{border-top:1px solid #333;padding-top:6px;width:200px;text-align:center}
        @media print{button{display:none}}</style></head><body>
        <h1>Delivery Challan</h1><h2>Metal Casting ERP · ${esc(d.dispatch_no)}</h2>
        <table>${row('Dispatch No', d.dispatch_no)}${row('Dispatch Date', moneyDate(d.dispatch_date))}${row('Challan No', d.challan_no)}${row('Invoice No', d.invoice_no)}${row('Customer', o.customer_name)}${row('Customer Mobile', o.customer_mobile)}${row('Order No', o.order_id)}</table>
        <table class="items"><tr><th>#</th><th>Product</th><th>Model ID</th><th>Quantity (pcs)</th></tr><tr><td>1</td><td>${esc(o.model_name)}</td><td>${esc(o.model_id)}</td><td>${num(d.qty)}</td></tr></table>
        <table>${row('Vehicle No', d.vehicle_no)}${row('Transporter', d.transporter)}${row('Driver', d.driver_name)}${row('Driver Mobile', d.driver_mobile)}${row('Remarks', d.remarks)}</table>
        <div class="sign"><div>Receiver's Signature</div><div>Authorised Signatory</div></div>
        <p><button onclick="print()">Print</button></p></body></html>`);
      w.document.close();
      w.focus();
    }

    document.getElementById('sideMark').innerHTML = icon('logo');
    document.getElementById('topMark').innerHTML = icon('logo');
    document.getElementById('btnBack').innerHTML = icon('back');
    document.getElementById('btnRefresh').innerHTML = icon('refresh');
    renderNav();
    refreshAll();
  </script>
</body>
</html>
