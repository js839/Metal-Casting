<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metal Casting ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b1b33;
      --navy-2: #13294b;
      --navy-3: #1c3760;
      --accent: #e8590c;
      --accent-2: #c2410c;
      --accent-soft: #fff1e8;
      --ink: #0f172a;
      --ink-2: #334155;
      --muted: #64748b;
      --line: #e3e8ef;
      --line-2: #eef2f6;
      --bg: #f3f5f9;
      --panel: #ffffff;
      --soft: #f8fafc;
      --danger: #c0262d;
      --danger-soft: #fdecec;
      --warn: #b45309;
      --warn-soft: #fff6e0;
      --success: #15803d;
      --success-soft: #e7f7ed;
      --info: #1d4ed8;
      --info-soft: #e8efff;
      --teal: #0f766e;
      --teal-soft: #e3f6f3;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
      --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, .22);
      --side-w: 248px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.45; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; background: none; }
    h1, h2, h3, p { margin: 0; }
    a { color: var(--accent-2); }
    .ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ic.sm { width: 15px; height: 15px; }
    .ic.lg { width: 22px; height: 22px; }

    /* ---------- Layout ---------- */
    .app { min-height: 100vh; }
    .side { display: none; }
    .main { min-width: 0; padding-bottom: 88px; }
    .topbar { position: sticky; top: 0; z-index: 12; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .topbar .brand { color: var(--ink); }
    .crumb { display: none; color: var(--muted); font-size: 13px; font-weight: 500; }
    .crumb b { color: var(--ink); font-weight: 600; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .content { padding: 18px 16px 24px; max-width: 1440px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brandmark { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #f97316, #c2410c); color: white; flex: none; box-shadow: 0 6px 16px rgba(232,89,12,.35); }
    .brand h1 { font-size: 15px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
    .brand p { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); white-space: nowrap; }
    .conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; }
    .conn.ok { color: var(--success); background: var(--success-soft); border-color: #c6ebd3; }
    .conn.ok::before { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
    .conn.err { color: var(--danger); background: var(--danger-soft); border-color: #f5c9cb; }
    .conn.err::before { background: var(--danger); }

    .screen { display: none; animation: fade .18s ease; }
    .screen.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .page-title h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
    .page-title p { margin-top: 4px; color: var(--muted); font-size: 13.5px; }
    .page-title .pt-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ---------- Buttons ---------- */
    .btn, .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: var(--radius-sm); font-weight: 600; min-height: 38px; padding: 0 14px; white-space: nowrap; transition: background .15s, box-shadow .15s, color .15s, border-color .15s; border: 1px solid transparent; }
    .icon-btn { width: 38px; padding: 0; color: var(--ink-2); background: white; border-color: var(--line); }
    .icon-btn:hover { background: var(--soft); color: var(--ink); }
    .btn.primary { background: var(--accent); color: white; box-shadow: 0 1px 2px rgba(194,65,12,.3), inset 0 1px 0 rgba(255,255,255,.15); }
    .btn.primary:hover { background: var(--accent-2); }
    .btn.secondary { background: var(--accent-soft); color: var(--accent-2); border-color: #fbd5bd; }
    .btn.secondary:hover { background: #ffe4d1; }
    .btn.ghost { background: white; color: var(--ink-2); border-color: var(--line); }
    .btn.ghost:hover { background: var(--soft); color: var(--ink); }
    .btn.danger { background: white; color: var(--danger); border-color: #f3c7c9; }
    .btn.danger:hover { background: var(--danger-soft); }
    .btn.success { background: var(--success-soft); color: var(--success); border-color: #c6ebd3; }
    .btn.small { min-height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; gap: 5px; }
    .btn.icon-only { width: 30px; padding: 0; }
    .btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .side-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Cards / KPIs ---------- */
    .grid { display: grid; gap: 12px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 18px; }
    .card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
    .stat { padding: 14px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; position: relative; overflow: hidden; }
    .stat span { color: var(--muted); font-size: 12px; font-weight: 600; display: block; }
    .stat strong { display: block; margin-top: 6px; font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--soft); color: var(--ink-2); }
    .tone-orange .stat-ic { background: var(--accent-soft); color: var(--accent-2); }
    .tone-blue .stat-ic { background: var(--info-soft); color: var(--info); }
    .tone-green .stat-ic { background: var(--success-soft); color: var(--success); }
    .tone-amber .stat-ic { background: var(--warn-soft); color: var(--warn); }
    .tone-teal .stat-ic { background: var(--teal-soft); color: var(--teal); }
    .tone-red .stat-ic { background: var(--danger-soft); color: var(--danger); }

    .nav-grid { grid-template-columns: 1fr; margin-bottom: 18px; }
    .nav-card { text-align: left; padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; background: white; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s, transform .15s; }
    .nav-card:hover { border-color: #f6b892; box-shadow: var(--shadow); transform: translateY(-1px); }
    .nav-card .go { color: #94a3b8; }
    .nav-card:hover .go { color: var(--accent); }
    .nav-icon, .avatar { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); flex: none; }
    .nav-card h3 { font-size: 14.5px; font-weight: 600; }
    .nav-card p { margin-top: 2px; color: var(--muted); font-size: 12.5px; }

    .panel { padding: 0; margin-bottom: 18px; overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .count { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 999px; background: var(--line-2); color: var(--ink-2); font-size: 12px; font-weight: 600; }
    .panel-body { padding: 16px; }

    /* ---------- Toolbar / search ---------- */
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .search-box { position: relative; flex: 1 1 240px; min-width: 0; }
    .search-box .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }
    .search, .field input, .field select, .field textarea, .select { width: 100%; border: 1px solid var(--line); background: white; color: var(--ink); border-radius: var(--radius-sm); min-height: 38px; padding: 8px 12px; outline: 0; transition: border-color .15s, box-shadow .15s; }
    .search-box .search { padding-left: 34px; }
    .select { width: auto; min-width: 160px; padding-right: 30px; }
    .field textarea { resize: vertical; min-height: 84px; }
    .search:focus, .select:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,89,12,.14); }
    .field input:disabled { background: var(--soft); color: var(--muted); }

    /* ---------- Tabs ---------- */
    .tabs { display: inline-flex; gap: 2px; overflow-x: auto; padding: 3px; background: var(--line-2); border-radius: 10px; max-width: 100%; }
    .tab { white-space: nowrap; border-radius: 8px; min-height: 32px; padding: 0 12px; color: var(--muted); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--ink); background: white; box-shadow: var(--shadow-sm); }
    .tab .count { min-height: 18px; padding: 0 6px; font-size: 11px; background: rgba(15,23,42,.06); }
    .tab.active .count { background: var(--accent-soft); color: var(--accent-2); }

    /* ---------- Data table ---------- */
    .table-wrap { width: 100%; overflow-x: auto; }
    table.dt { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
    .dt thead th { position: sticky; top: 0; background: #f8fafc; color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .dt tbody td { padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; color: var(--ink-2); }
    .dt tbody tr:last-child td { border-bottom: 0; }
    .dt tbody tr { transition: background .12s; }
    .dt tbody tr.click { cursor: pointer; }
    .dt tbody tr:hover td { background: #fbfcfe; }
    .dt .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .dt .nowrap { white-space: nowrap; }
    .dt .act { text-align: right; white-space: nowrap; width: 1%; }
    .dt .strong { color: var(--ink); font-weight: 600; }
    .dt .mono { white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; color: var(--ink); font-weight: 500; }
    .dt .desc { color: var(--muted); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dt .wide { min-width: 140px; }
    .cell-prod { display: flex; align-items: center; gap: 10px; min-width: 180px; }
    .cell-prod b { display: block; color: var(--ink); font-weight: 600; }
    .cell-prod small { display: block; color: var(--muted); font-size: 12px; }
    .sub { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
    .muted { color: var(--muted); }
    .late { color: var(--danger); font-weight: 600; }
    .actions { display: inline-flex; gap: 6px; flex-wrap: nowrap; justify-content: flex-end; }

    .thumb { width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(135deg, #e2e8f0, #f1f5f9); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); font-weight: 700; font-size: 12px; overflow: hidden; flex: none; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.lg { width: 64px; height: 64px; border-radius: 10px; font-size: 16px; }

    /* ---------- Pills ---------- */
    .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
    .pill.active, .pill.Completed, .pill.Delivered, .pill.MoldsReady, .pill.Poured { background: var(--success-soft); color: var(--success); }
    .pill.Pending { background: var(--warn-soft); color: var(--warn); }
    .pill.InProduction, .pill.InProgress, .pill.Melting { background: var(--info-soft); color: var(--info); }
    .pill.Cancelled, .pill.inactive, .pill.Hold { background: var(--danger-soft); color: var(--danger); }
    .pill.NotStarted { background: #f1f5f9; color: #475569; }
    .pill.ReadyforPouring, .pill.ReadytoPour { background: var(--accent-soft); color: var(--accent-2); }

    /* ---------- Progress ---------- */
    .prog { display: flex; align-items: center; gap: 8px; min-width: 120px; }
    .prog small { font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
    .progress { flex: 1; height: 6px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
    .progress > i { display: block; height: 100%; background: linear-gradient(90deg, #fb923c, var(--accent)); border-radius: 999px; }
    .progress.done > i { background: #22c55e; }

    /* ---------- Category cards ---------- */
    .category-grid { grid-template-columns: 1fr; }
    .category-card { padding: 18px; text-align: left; display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; background: white; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s, transform .15s; }
    .category-card:hover { border-color: #f6b892; box-shadow: var(--shadow); transform: translateY(-1px); }
    .category-card .nav-icon { width: 48px; height: 48px; }
    .category-card strong { font-size: 15px; font-weight: 600; color: var(--ink); display: block; }
    .category-card span.sub { margin-top: 3px; font-size: 13px; }
    .category-card .big { font-size: 24px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

    /* ---------- Forms ---------- */
    .form-grid { display: grid; gap: 14px; }
    .field label { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-bottom: 6px; }
    .field label .req { color: var(--danger); }
    .error { display: none; color: var(--danger); font-size: 12px; margin-top: 5px; font-weight: 500; }
    .field.invalid .error { display: block; }
    .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--danger); }
    .form-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--line); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .upload-box { display: grid; gap: 12px; grid-template-columns: 88px 1fr; align-items: center; padding: 12px; border: 1px dashed #cbd5e1; border-radius: 10px; background: var(--soft); }
    .preview { width: 88px; height: 88px; border-radius: 10px; display: grid; place-items: center; overflow: hidden; background: white; border: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: 12px; }
    .preview img { width: 100%; height: 100%; object-fit: cover; }
    .upload-box input[type=file] { font-size: 12.5px; max-width: 100%; }
    .ctx { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); }
    .ctx b { display: block; color: var(--ink); }
    .ctx small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }

    /* material lines */
    .lines { display: grid; gap: 8px; }
    .line { display: grid; grid-template-columns: 1fr 120px 30px; gap: 8px; align-items: center; }
    .line select, .line input { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); min-height: 38px; padding: 7px 10px; background: white; outline: 0; }
    .line select:focus, .line input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,89,12,.14); }
    .line-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .line-head label { margin: 0 !important; }

    /* ---------- Detail / history ---------- */
    .detail { display: grid; grid-template-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .detail-kv { display: grid; grid-template-columns: 140px 1fr; gap: 12px; font-size: 13.5px; padding: 10px 14px; border-bottom: 1px solid var(--line-2); align-items: center; }
    .detail-kv:nth-child(odd) { background: #fbfcfd; }
    .detail-kv:last-child { border-bottom: 0; }
    .detail-kv span { color: var(--muted); font-weight: 500; }
    .detail-kv strong { color: var(--ink); font-weight: 600; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .summary div { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .summary span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    .summary b { display: block; font-size: 18px; font-weight: 700; color: var(--ink); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .hist { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; background: white; }
    .hist-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; color: var(--ink); }
    .row-meta { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
    .row-meta b { color: var(--ink-2); }
    .list { display: grid; gap: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { font-size: 12px; background: var(--line-2); color: var(--ink-2); border-radius: 6px; padding: 3px 8px; font-weight: 500; white-space: nowrap; }
    .chip b { font-weight: 600; color: var(--ink); }
    .section-label { font-size: 11.5px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .05em; }
    .modal .table-wrap { border: 1px solid var(--line); border-radius: 10px; }

    /* ---------- States ---------- */
    .empty, .loading, .notice { padding: 36px 18px; text-align: center; color: var(--muted); font-size: 13.5px; }
    .empty .ic { width: 34px; height: 34px; display: block; margin: 0 auto 8px; color: #cbd5e1; }
    .notice { background: var(--warn-soft); border: 1px solid #f6dfa8; color: #7c4a03; border-radius: var(--radius); text-align: left; padding: 16px; }
    .skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, #eef2f6, #f8fafc, #eef2f6); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .hidden { display: none !important; }
    .desktop-only { display: none; }

    /* ---------- Toast / bottom nav / modal ---------- */
    .toast { position: fixed; left: 14px; right: 14px; bottom: 84px; background: var(--navy); color: white; border-radius: 10px; padding: 12px 14px; font-weight: 500; box-shadow: var(--shadow-lg); transform: translateY(140px); opacity: 0; transition: .22s ease; z-index: 40; display: flex; align-items: center; gap: 10px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; height: 66px; display: grid; grid-template-columns: repeat(5, 1fr); background: white; border-top: 1px solid var(--line); z-index: 15; padding-bottom: env(safe-area-inset-bottom); }
    .bottom-nav button { color: var(--muted); display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 600; }
    .bottom-nav button.active { color: var(--accent-2); }
    .modal { position: fixed; inset: 0; display: none; place-items: end center; background: rgba(11,27,51,.5); backdrop-filter: blur(2px); padding: 0; z-index: 30; }
    .modal.open { display: grid; }
    .modal-card { width: min(760px, 100%); max-height: 92vh; overflow: auto; background: white; border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg); animation: up .2s ease; }
    @keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; background: white; border-bottom: 1px solid var(--line); }
    .modal-head h3 { font-size: 16px; font-weight: 700; color: var(--ink); }
    .modal-body { padding: 18px; }

    /* ---------- Side nav ---------- */
    .side-nav { display: grid; gap: 2px; }
    .side-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #6b819f; padding: 18px 12px 6px; }
    .side-nav button { display: flex; align-items: center; gap: 11px; text-align: left; color: #b6c4d8; border-radius: 8px; min-height: 40px; padding: 0 12px; font-weight: 500; font-size: 13.5px; transition: background .15s, color .15s; position: relative; }
    .side-nav button:hover { background: rgba(255,255,255,.06); color: white; }
    .side-nav button.active { background: rgba(255,255,255,.1); color: white; font-weight: 600; }
    .side-nav button.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
    .side-nav button.active .ic { color: #fb923c; }
    .side-foot { margin-top: auto; padding: 12px; border-radius: 10px; background: rgba(255,255,255,.05); color: #8ea2bf; font-size: 12px; }
    .side-foot b { color: white; display: block; font-size: 13px; margin-bottom: 2px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 759px) {
      .dt thead { display: none; }
      .dt, .dt tbody, .dt tr, .dt td { display: block; width: 100%; }
      .dt tbody tr { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .dt tbody tr:last-child { border-bottom: 0; }
      .dt tbody td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 5px 0; border: 0; text-align: right; }
      .dt tbody td::before { content: attr(data-label); color: var(--muted); font-size: 12px; font-weight: 500; text-align: left; flex: none; }
      .dt tbody td.lead { padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px dashed var(--line); text-align: left; }
      .dt tbody td.lead::before { display: none; }
      .dt tbody td.act { width: 100%; padding-top: 10px; }
      .dt tbody td.act::before { display: none; }
      .dt tbody td.act .actions { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
      .dt .desc { max-width: 100%; }
      .dt tbody td .cv { min-width: 0; max-width: 70%; }
      .dt tbody td.lead .cv, .dt tbody td.act .cv { max-width: 100%; width: 100%; }
      .dt .cell-prod { min-width: 0; justify-content: flex-end; text-align: left; }
      .topbar .brand p { display: none; }
      .dt .prog { min-width: 140px; }
      .page-title .pt-actions { width: 100%; }
      .page-title .pt-actions .btn { flex: 1; }
      .select { flex: 1 1 140px; }
      .line { grid-template-columns: 1fr 96px 30px; }
      .detail-kv { grid-template-columns: 110px 1fr; }
    }
    @media (min-width: 640px) {
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .nav-grid, .category-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 760px) {
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field.full { grid-column: 1 / -1; }
      .modal { place-items: center; padding: 20px; }
      .modal-card { border-radius: 16px; }
      .content { padding: 24px 24px 32px; }
      .topbar { padding: 12px 24px; }
      .toast { left: auto; right: 24px; bottom: 24px; max-width: 420px; }
    }
    @media (min-width: 1024px) {
      .app { display: grid; grid-template-columns: var(--side-w) 1fr; }
      .side { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 18px 12px; background: linear-gradient(180deg, var(--navy) 0%, #0e2242 100%); color: white; overflow-y: auto; }
      .side .brand { padding: 4px 6px 6px; }
      .side .brand h1 { color: white; }
      .side .brand p { color: #8ea2bf; }
      .topbar .brand { display: none; }
      .crumb { display: block; }
      .main { padding-bottom: 0; }
      .bottom-nav { display: none; }
      .desktop-only { display: inline-flex; }
      .stats { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .stats.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .nav-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .content { padding: 28px 32px 40px; }
      .topbar { padding: 12px 32px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="brandmark" id="sideMark"></div><div><h1>Metal Casting ERP</h1><p>Foundry production suite</p></div></div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot"><b id="sideConn">Supabase</b>Live production database</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="brand"><div class="brandmark" id="topMark"></div><div><h1>Metal Casting ERP</h1><p>Foundry production suite</p></div></div>
        <div class="crumb" id="crumb"></div>
        <div class="header-actions">
          <span class="conn" id="connectionState">Connecting…</span>
          <button class="icon-btn" onclick="goBack()" title="Back" aria-label="Back" id="btnBack"></button>
          <button class="icon-btn" onclick="refreshAll()" title="Refresh data" aria-label="Refresh" id="btnRefresh"></button>
        </div>
      </header>
      <div class="content">
        <section id="dashboard" class="screen active"></section>
        <section id="products" class="screen"></section>
        <section id="raw" class="screen"></section>
        <section id="consumables" class="screen"></section>
        <section id="orders" class="screen"></section>
        <section id="molding" class="screen"></section>
        <section id="melting" class="screen"></section>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" onclick="if(event.target===this) closeModal()"></div>

  <script>
    const SUPABASE_URL = 'https://uzwxlbiburoxxwswyhfn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_eslhYU3e2HirtqY6Nmi56Q_jdYeKQyK';
    const API = `${SUPABASE_URL}/rest/v1`;
    const headers = {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    };

    /* ============================ ICONS ============================ */
    const ICONS = {
      logo: '<path d="M6 3h12l-2 6H8z"/><path d="M8 9c0 5 1.5 8 4 12 2.5-4 4-7 4-12"/>',
      dashboard: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
      products: '<path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
      raw: '<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
      consumables: '<path d="M9 3h6"/><path d="M10 3v6L4.6 18.4A1.8 1.8 0 0 0 6.2 21h11.6a1.8 1.8 0 0 0 1.6-2.6L14 9V3"/><path d="M7 15h10"/>',
      orders: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/>',
      molding: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
      melting: '<path d="M12 22c4 0 7-3 7-7 0-3-2-5.5-3.5-7-.3 2-1.5 3.5-3 3.5C13 8 12 5 9 2c0 4-4 6.5-4 12 0 4.5 3 8 7 8z"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/>',
      back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
      trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
      history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      chevron: '<path d="m9 18 6-6-6-6"/>',
      pause: '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
      play: '<path d="m6 3 14 9-14 9z"/>',
      check: '<path d="M20 6 9 17l-5-5"/>',
      close: '<path d="M18 6 6 18M6 6l12 12"/>',
      flag: '<path d="M4 22V4a1 1 0 0 1 1-1h12l-2 5 2 5H5"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5h4"/>',
      inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/>',
      weight: '<circle cx="12" cy="5" r="3"/><path d="M6.5 8h11l3 13h-17z"/>',
      status: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'
    };
    const icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;

    const navItems = [
      ['dashboard', 'Home', 'Dashboard', 'Overview'],
      ['products', 'Product', 'Product Master', 'Masters'],
      ['raw', 'Raw', 'Raw Material', 'Masters'],
      ['consumables', 'Consumables', 'Consumables', 'Masters'],
      ['orders', 'Orders', 'Orders', 'Operations'],
      ['molding', 'Molding', 'Molding', 'Production'],
      ['melting', 'Melting', 'Melting & Pouring', 'Production']
    ];
    const bottomNavIds = ['dashboard', 'products', 'orders', 'molding', 'melting'];
    const rawCategories = ['Scrap Input', 'FE Alloy & Metal Input'];
    const consumableCategories = ['Melting & Pouring Consumable', 'Molding & Molding Consumable'];
    const units = ['KG', 'Ton', 'Gram', 'Litre', 'Pcs', 'Box'];
    const orderStatuses = ['Pending', 'In Production', 'Completed', 'Delivered', 'Cancelled'];
    const state = { page: 'dashboard', history: [], loading: true, products: [], raw_materials: [], consumables: [], orders: [], search: {}, filter: { orderStatus: 'All', molding: 'All', melting: 'Ready to Pour' }, molding_jobs: [], molding_entries: [], molding_usage: [], melting_batches: [], melting_usage: [], productionReady: false, productionError: '', selectedRawCategory: null, selectedConsumableCategory: null };

    function request(path, options = {}) {
      return fetch(`${API}/${path}`, { ...options, headers: { ...headers, ...(options.headers || {}) } })
        .then(async response => {
          const text = await response.text();
          const data = text ? JSON.parse(text) : null;
          if (!response.ok) throw new Error(data?.message || data?.hint || response.statusText);
          return data;
        });
    }

    function setConn(text, cls) {
      const el = document.getElementById('connectionState');
      el.textContent = text;
      el.className = `conn ${cls || ''}`;
      document.getElementById('sideConn').textContent = text;
    }

    async function refreshAll() {
      setLoading(true);
      setConn('Syncing…');
      try {
        const [products, raw, consumables, orders] = await Promise.all([
          request('products?select=*&order=created_at.desc'),
          request('raw_materials?select=*&order=created_at.desc'),
          request('consumables?select=*&order=created_at.desc'),
          request('orders?select=*&order=created_at.desc')
        ]);
        Object.assign(state, { products, raw_materials: raw, consumables, orders });
        try {
          const [jobs, entries, mUsage, batches, bUsage] = await Promise.all([
            request('molding_jobs?select=*&order=created_at.desc'),
            request('molding_entries?select=*&order=entry_date.desc'),
            request('molding_consumable_usage?select=*'),
            request('melting_batches?select=*&order=created_at.desc'),
            request('melting_material_usage?select=*')
          ]);
          Object.assign(state, { molding_jobs: jobs, molding_entries: entries, molding_usage: mUsage, melting_batches: batches, melting_usage: bUsage, productionReady: true, productionError: '' });
        } catch (prodError) {
          Object.assign(state, { productionReady: false, productionError: prodError.message });
        }
        setConn('Live', 'ok');
        setLoading(false);
        render();
      } catch (error) {
        setConn('Offline', 'err');
        toast(error.message, true);
        renderError(error.message);
      } finally {
        setLoading(false);
      }
    }

    function setLoading(value) { state.loading = value; }
    function esc(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function today() { return new Date().toISOString().slice(0, 10); }
    function moneyDate(value) { return value ? new Date(`${value}T00:00:00`).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Not set'; }
    function dueDate(o) {
      if (!o.delivery_date) return `<span class="muted">Not set</span>`;
      const late = o.delivery_date < today() && !['Completed', 'Delivered', 'Cancelled'].includes(o.status);
      return `<span class="${late ? 'late' : ''}" title="${late ? 'Overdue' : ''}">${moneyDate(o.delivery_date)}</span>`;
    }
    function statusClass(value) { return String(value || '').replace(/\s/g, ''); }
    function pill(text, cls) { return `<span class="pill ${cls ?? statusClass(text)}">${esc(text)}</span>`; }
    function activePill(s) { return `<span class="pill ${s === 'Active' ? 'active' : 'inactive'}">${esc(s)}</span>`; }
    function toast(message, error = false) {
      const node = document.getElementById('toast');
      node.innerHTML = `${icon(error ? 'close' : 'check')}<span>${esc(message)}</span>`;
      node.style.background = error ? '#7f1d1d' : 'var(--navy)';
      node.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => node.classList.remove('show'), 3000);
    }

    function navigate(page, opts = {}) {
      if (!opts.replace && state.page !== page) state.history.push(state.page);
      state.page = page;
      document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === page));
      renderNav();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function goBack() {
      const prev = state.history.pop();
      navigate(prev || 'dashboard', { replace: true });
    }

    function renderNav() {
      let group = '';
      const navHtml = navItems.map(([id, short, label, grp]) => {
        const head = grp !== group ? `<div class="side-label">${grp}</div>` : '';
        group = grp;
        return `${head}<button class="${state.page === id ? 'active' : ''}" onclick="navigate('${id}')">${icon(id)}<span>${label}</span></button>`;
      }).join('');
      document.getElementById('sideNav').innerHTML = navHtml;
      document.getElementById('bottomNav').innerHTML = navItems.filter(([id]) => bottomNavIds.includes(id)).map(([id, short]) => `<button class="${state.page === id ? 'active' : ''}" onclick="navigate('${id}')">${icon(id)}<span>${short}</span></button>`).join('');
      const cur = navItems.find(n => n[0] === state.page);
      document.getElementById('crumb').innerHTML = cur ? `${cur[3]} &nbsp;/&nbsp; <b>${cur[2]}</b>` : '';
    }

    function header(title, subtitle, action = '') {
      return `<div class="page-title"><div><h2>${title}</h2><p>${subtitle}</p></div>${action ? `<div class="pt-actions">${action}</div>` : ''}</div>`;
    }

    /* ---------- reusable UI builders ---------- */
    function statCards(list, extraCls = '') {
      return `<div class="grid stats ${extraCls}">${list.map(([label, value, ic, tone]) => `<div class="card stat tone-${tone || 'orange'}"><div><span>${label}</span><strong>${value}</strong></div><div class="stat-ic">${icon(ic || 'status')}</div></div>`).join('')}</div>`;
    }
    function td(label, content, cls = '') { return `<td data-label="${label}" class="${cls}"><div class="cv">${content}</div></td>`; }
    function emptyState(msg, ic = 'inbox') { return `<div class="empty">${icon(ic)}${msg}</div>`; }
    function dataTable(cols, rows, emptyMsg) {
      if (!rows.length) return emptyState(emptyMsg);
      return `<div class="table-wrap"><table class="dt"><thead><tr>${cols.map(c => { const [l, cls] = Array.isArray(c) ? c : [c, '']; return `<th class="${cls}">${l}</th>`; }).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
    }
    function tablePanel(title, count, tools, body) {
      return `<div class="panel"><div class="panel-head"><h3>${title}${count != null ? ` <span class="count">${count}</span>` : ''}</h3>${tools ? `<div class="toolbar">${tools}</div>` : ''}</div>${body}</div>`;
    }
    function searchBox(key, placeholder, rerender) {
      return `<div class="search-box">${icon('search', 'sm')}<input id="q-${key}" class="search" placeholder="${placeholder}" value="${esc(state.search[key] || '')}" oninput="state.search.${key}=this.value; refocus(${rerender}, 'q-${key}')"></div>`;
    }
    function refocus(fn, id) {
      fn();
      const el = document.getElementById(id);
      if (el) { el.focus(); const n = el.value.length; el.setSelectionRange(n, n); }
    }
    function actBtn(cls, ic, label, onclick, iconOnly = false) {
      return `<button class="btn small ${cls}${iconOnly ? ' icon-only' : ''}" onclick="${onclick}" title="${label}" aria-label="${label}">${icon(ic, 'sm')}${iconOnly ? '' : `<span>${label}</span>`}</button>`;
    }
    function prodCell(img, name, sub) {
      return `<div class="cell-prod">${thumb(img, name)}<div><b>${esc(name)}</b><small>${esc(sub || '')}</small></div></div>`;
    }

    function render() {
      renderNav();
      renderDashboard();
      renderProducts();
      renderRaw();
      renderConsumables();
      renderOrders();
      renderMolding();
      renderMelting();
    }

    function renderError(message) {
      document.getElementById(state.page).innerHTML = header('Connection issue', 'Supabase request failed') + `<div class="notice"><b>Could not load data.</b><br>${esc(message)}<br><br><button class="btn primary small" onclick="refreshAll()">${icon('refresh', 'sm')}<span>Try again</span></button></div>`;
    }

    function renderDashboard() {
      const completed = state.orders.filter(o => o.status === 'Completed').length;
      const pending = state.orders.filter(o => o.status === 'Pending').length;
      const cards = statCards([
        ['Total Products', state.products.length, 'products', 'blue'],
        ['Raw Materials', state.raw_materials.length, 'raw', 'teal'],
        ['Consumables', state.consumables.length, 'consumables', 'teal'],
        ['Total Orders', state.orders.length, 'orders', 'orange'],
        ['Pending Orders', pending, 'clock', 'amber'],
        ['Completed Orders', completed, 'check', 'green']
      ]);
      const recent = state.orders.slice(0, 6);
      document.getElementById('dashboard').innerHTML =
        header('Dashboard', 'Manufacturing master data, orders and production at a glance', `<button class="btn primary" onclick="navigate('orders'); openOrderForm()">${icon('plus', 'sm')}<span>New Order</span></button>`) +
        cards +
        `<div class="grid nav-grid">
          ${navTile('products', 'Product Master', 'Products, models and images')}
          ${navTile('raw', 'Raw Material Master', 'Scrap and FE alloy inputs')}
          ${navTile('consumables', 'Consumables Master', 'Melting, pouring and molding')}
          ${navTile('orders', 'Order Management', 'Place and track orders')}
          ${navTile('molding', 'Molding', `${state.orders.filter(o => ACTIVE_ORDER(o) && (jobFor(o.id)?.status || 'Not Started') !== 'Molds Ready').length} orders waiting for molds`)}
          ${navTile('melting', 'Melting & Pouring', `${state.orders.reduce((s, o) => s + (ACTIVE_ORDER(o) ? availableMolds(o.id) : 0), 0)} molds ready to pour`)}
         </div>` +
        tablePanel('Recent Orders', recent.length, `<button class="btn small ghost" onclick="navigate('orders')"><span>View all</span>${icon('chevron', 'sm')}</button>`,
          ordersTable(recent, 'No orders yet. Place the first order from Order Management.'));
    }

    function navTile(page, title, sub) {
      return `<button class="nav-card" onclick="navigate('${page}')"><span class="nav-icon">${icon(page, 'lg')}</span><span><h3>${title}</h3><p>${sub}</p></span><span class="go">${icon('chevron')}</span></button>`;
    }

    /* ============================ PRODUCTS ============================ */
    function renderProducts() {
      const q = (state.search.products || '').toLowerCase();
      const rows = state.products.filter(p => `${p.product_name} ${p.model_id} ${p.status}`.toLowerCase().includes(q));
      const active = state.products.filter(p => p.status === 'Active').length;
      const body = dataTable(
        [['Product', ''], ['Model ID', ''], ['Description', ''], ['Status', ''], ['Actions', 'act']],
        rows.map(p => `<tr class="click" onclick="showProductDetail('${p.id}')">
          ${td('Product', `<div class="cell-prod">${thumb(p.image_url, p.product_name)}<div><b>${esc(p.product_name)}</b></div></div>`, 'lead')}
          ${td('Model ID', `<span class="mono">${esc(p.model_id)}</span>`)}
          ${td('Description', esc(p.description || '—'), 'desc')}
          ${td('Status', activePill(p.status))}
          ${td('Actions', `<div class="actions" onclick="event.stopPropagation()">${actBtn('ghost', 'edit', 'Edit', `openProductForm('${p.id}')`)}${actBtn('danger', 'trash', 'Delete', `deleteRow('products','${p.id}')`, true)}</div>`, 'act')}
        </tr>`),
        q ? 'No product matches your search.' : 'No products yet. Add a product to start order entry.');
      document.getElementById('products').innerHTML =
        header('Product Master', 'Search, add, edit and manage product models', `<button class="btn primary" onclick="openProductForm()">${icon('plus', 'sm')}<span>Add Product</span></button>`) +
        statCards([['Total Products', state.products.length, 'products', 'blue'], ['Active', active, 'check', 'green'], ['Inactive', state.products.length - active, 'pause', 'red']]) +
        tablePanel('All Products', rows.length, searchBox('products', 'Search product or model ID', 'renderProducts'), body);
    }

    /* ======================= RAW / CONSUMABLE MASTERS ======================= */
    function categoryCards(list, items, key, rerender, ic, noun) {
      return `<div class="grid category-grid">${list.map(c => {
        const n = items.filter(x => x.category === c).length;
        return `<button class="category-card" onclick="state.${key}='${c}'; ${rerender}()"><span class="nav-icon">${icon(ic, 'lg')}</span><span><strong>${c}</strong><span class="sub">${n} saved ${noun}</span></span><span class="big">${n}</span></button>`;
      }).join('')}</div>`;
    }
    function categoryTabs(list, items, key, rerender) {
      return `<div class="tabs">${list.map(c => `<button class="tab ${state[key] === c ? 'active' : ''}" onclick="state.${key}='${c}'; ${rerender}()">${c} <span class="count">${items.filter(x => x.category === c).length}</span></button>`).join('')}</div>`;
    }
    function masterTable(rows, kind, emptyMsg) {
      const isRaw = kind === 'raw';
      const table = isRaw ? 'raw_materials' : 'consumables';
      return dataTable(

    function field(id, label, value = '', type = 'text', req = false) {
      return `<div class="field ${type === 'textarea' ? 'full' : ''}" data-field="${id}"><label for="${id}">${label}${req ? ' <span class="req">*</span>' : ''}</label>${type === 'textarea' ? `<textarea id="${id}">${esc(value)}</textarea>` : `<input id="${id}" type="${type}" value="${esc(value)}">`}<div class="error">${label} is required</div></div>`;
    }
    function selectField(id, label, value, options, req = false) {
      return `<div class="field" data-field="${id}"><label for="${id}">${label}${req ? ' <span class="req">*</span>' : ''}</label><select id="${id}">${options.map(o => `<option value="${esc(o)}" ${value === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select><div class="error">${label} is required</div></div>`;
    }
    function validate(ids) {
      let ok = true;
      ids.forEach(id => {
        const el = document.getElementById(id);
        const wrap = document.querySelector(`[data-field="${id}"]`);
        const invalid = !String(el.value || '').trim();
        wrap?.classList.toggle('invalid', invalid);
        if (invalid) ok = false;
      });
      return ok;
    }
    function formActions(submitLabel, extra = '') {
      return `<div class="form-actions field full"><button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>${extra}<button class="btn primary" type="submit">${icon('check', 'sm')}<span>${submitLabel}</span></button></div>`;

    function imageUpload(current = '') {
      return `<div class="field full"><label>Product Image</label><div class="upload-box"><div class="preview" id="imagePreview">${current ? `<img src="${esc(current)}" alt="">` : 'No image'}</div><div><input id="imageFile" type="file" accept="image/*" capture="environment" onchange="previewImage(event)"><input id="imageUrl" class="search" placeholder="Or paste image URL" value="${esc(current)}" oninput="setPreview(this.value)" style="margin-top:8px"></div></div></div>`;
    }
    function previewImage(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { document.getElementById('imageUrl').value = reader.result; setPreview(reader.result); };
      reader.readAsDataURL(file);
    }
    function setPreview(src) { document.getElementById('imagePreview').innerHTML = src ? `<img src="${esc(src)}" alt="">` : 'No image'; }

    async function saveOrder(event, id) {
      event.preventDefault();
      if (!validate(['product_id', 'model_id_auto', 'customer_name', 'order_date', 'quantity'])) return;
      const p = state.products.find(x => x.id === val('product_id'));
      const payload = { product_id: p.id, model_name: p.product_name, model_id: p.model_id, product_image_url: p.image_url, customer_name: val('customer_name'), customer_mobile: val('customer_mobile'), order_date: val('order_date'), delivery_date: val('delivery_date') || null, quantity: Number(val('quantity')), remarks: val('remarks'), status: val('status') || 'Pending' };

    function openStatusForm(id) {
      const o = state.orders.find(x => x.id === id);
      modal(`Update Status · ${esc(o.order_id || '')}`, `<form class="form-grid" onsubmit="saveStatus(event,'${id}')"><div class="field full">${selectField('status', 'Order Status', o.status, orderStatuses)}</div>${formActions('Update Status')}</form>`);

    async function saveStatus(event, id) { event.preventDefault(); await save('orders', id, { status: val('status') }, 'Status updated'); }

    function val(id) { return document.getElementById(id)?.value?.trim() || ''; }
    async function save(table, id, payload, message) {
      try {
        if (id) await request(`${table}?id=eq.${id}`, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify(payload) });
        else await request(table, { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(payload) });
        closeModal();
        await refreshAll();
        toast(message);
      } catch (error) { toast(error.message, true); }
    }
    async function deleteRow(table, id) {
      if (!confirm('Delete this record?')) return;
      try {
        await request(`${table}?id=eq.${id}`, { method: 'DELETE' });
        closeModal();
        await refreshAll();
        toast('Record deleted');
      } catch (error) { toast(error.message, true); }
    }

    function details(title, rows, actions = '', top = '') {
      modal(title, `${top}<div class="detail">${rows.map(([k,v]) => `<div class="detail-kv"><span>${esc(k)}</span><strong>${v || '—'}</strong></div>`).join('')}</div><div class="form-actions">${actions}</div>`);
    }
    function detailTop(img, name, sub, badge) {
      return `<div class="ctx" style="margin-bottom:14px">${thumb(img, name, 'lg')}<div style="flex:1"><b style="font-size:16px">${esc(name)}</b><small>${sub}</small></div>${badge || ''}</div>`;

        `<button class="btn danger" onclick="deleteRow('products','${id}')">${icon('trash', 'sm')}<span>Delete</span></button><button class="btn primary" onclick="openProductForm('${id}')">${icon('edit', 'sm')}<span>Edit Product</span></button>`,

    }
    function showConsumableDetail(id) {
